<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comptes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7E3D5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Comptes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  /* fond et surfaces : un vrai écart entre le canevas et les cartes */
  --bg:#F3F2EE;
  --surface:#FFFFFF;
  --surface-2:#F7F6F3;
  --line:#E6E3DC;
  --line-2:#F0EEE9;

  --tx:#17191A;
  --tx2:#65685F;
  --tx3:#6E7268;           /* 4,9:1 sur blanc */
  --tx4:#9B9C94;           /* purement décoratif : filets, icônes vides */

  --acc:#1E5C48;
  --asset:#349091;
  --acc-2:#3C5D96;      /* l'épargne : disponible, mais pas tout de suite */   /* la couleur de « placé », la même partout */      /* l'argent placé, distinct du vert des comptes */
  --acc-hover:#174C3B;
  --acc-soft:#E4EFE9;

  --pos:#1E7A50;
  --neg:#A34A32;

  /* barre latérale sombre : c'est elle qui structure l'écran */
  --side:#141917;
  --side-2:#1C2320;
  --side-tx:#9BA49F;
  --side-line:rgba(255,255,255,.07);

  --sh-1:0 1px 2px rgba(20,26,22,.05);
  --sh-2:0 1px 3px rgba(20,26,22,.06), 0 14px 30px -16px rgba(20,26,22,.22);

  --r:14px;
  --titlebar:38px;
  --ctl:36px;              /* hauteur unique de tous les contrôles de la barre d'outils */
  --gut:28px;--gap:18px;              /* gouttière partagée entre la barre de titre et le contenu */
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;overflow:hidden;cursor:default;-webkit-user-select:none;user-select:none;
}
input,select,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}

/* ---------- barre latérale ---------- */
aside{
  width:216px;flex:0 0 216px;height:100vh;background:var(--side);
  padding:var(--titlebar) 14px 16px;display:flex;flex-direction:column;gap:2px;
}
.brand{padding:10px 10px 20px;display:flex;align-items:center;gap:11px}
.brand .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#2E7D63,#1E5C48);
            display:grid;place-items:center;flex:0 0 30px;box-shadow:0 2px 8px rgba(30,92,72,.45)}
.brand h1{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:#F2F4F2}
.brand span{display:block;font-size:11px;color:#7C857F;font-weight:450;letter-spacing:.01em;margin-top:1px}
nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{
  display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:9px;color:var(--side-tx);
  font-size:13.5px;font-weight:500;text-align:left;width:100%;min-height:38px;
  transition-property:background-color,color;transition-duration:130ms;transition-timing-function:ease-out;
}
.nav-btn:hover{background:rgba(255,255,255,.05);color:#E8EBE9}
.nav-btn.on{background:rgba(255,255,255,.09);color:#FFFFFF;font-weight:550}
.nav-btn svg{width:17px;height:17px;flex:0 0 17px;opacity:.6}
.nav-btn.on svg{opacity:1;color:#5FBF9B}
.foot-pair{display:flex;align-items:center;gap:4px;padding:8px 10px 2px}
.foot-pair span{flex:1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6C7370}
.nav-btn.mini{width:30px;height:30px;padding:0;flex:0 0 30px;justify-content:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--side-line)}
.side-foot .nav-btn{font-size:12.5px;color:#767F7A;padding:7px 11px}
.side-foot .nav-btn:hover{color:#B9C1BC}
.side-foot .nav-btn svg{width:15px;height:15px;flex:0 0 15px}

/* ---------- zone principale ---------- */
main{flex:1;height:100vh;overflow-y:auto;padding-bottom:56px;background:var(--bg)}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(243,242,238,.88);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  padding:var(--titlebar) var(--gut) 14px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);
}
.topbar h2{font-size:22px;font-weight:640;letter-spacing:-.025em;line-height:1.15}
.topbar .sub{font-size:12.5px;color:var(--tx3);margin-top:2px}
.topbar .sp{flex:1}
.topbar > *{flex-shrink:0}
.tb-title{flex-shrink:1}
.tb-title{min-width:0}
.back{display:grid;place-items:center;width:var(--ctl);height:var(--ctl);flex:0 0 var(--ctl);border-radius:10px;color:var(--tx2);
      border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1);
      transition-property:border-color,color,transform;transition-duration:130ms;transition-timing-function:ease-out}
.back:active{transform:scale(.94)}
.back:hover{color:var(--acc);border-color:var(--acc)}
.back svg{width:16px;height:16px}
.back[hidden]{display:none}
.wrap{padding:24px var(--gut);max-width:1360px;display:flex;flex-direction:column;gap:var(--gap)}

/* ---------- contrôles ---------- */
.btn{
  height:var(--ctl);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:9px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:500;color:var(--tx);white-space:nowrap;box-shadow:var(--sh-1);
  transition-property:background-color,border-color,box-shadow,transform;
  transition-duration:130ms;transition-timing-function:ease-out;
}
.btn:active{transform:scale(.975)}
.btn:hover{border-color:#D3CFC5;box-shadow:0 1px 4px rgba(20,26,22,.09)}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:550;
       box-shadow:0 1px 2px rgba(30,92,72,.28),0 6px 16px -8px rgba(30,92,72,.55)}
.btn-p:hover{background:var(--acc-hover);border-color:var(--acc-hover)}
.btn-s{height:30px;padding:0 11px;font-size:12.5px}
.btn-danger{color:var(--neg)}
.btn-danger:hover{background:#FBEDE9;border-color:#E4BFB4}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- cartes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:20px 22px;box-shadow:var(--sh-2)}
/* carte secondaire : posée sur le fond, sans ombre — elle ne doit pas peser autant
   que la liste principale à côté d'elle. Avant, six rectangles de poids identique. */
.card.sub{box-shadow:var(--sh-1);border-color:var(--line-2)}
.card.sub h3{color:var(--tx2)}
/* niveau 1 — titre de carte : lisible, pas une étiquette technique */
.card h3{font-size:14px;font-weight:640;color:var(--tx);letter-spacing:-.015em;margin-bottom:16px}
/* niveau 2 — intertitre dans une carte */
.sect{font-size:11px;font-weight:650;color:var(--tx3);text-transform:uppercase;
      letter-spacing:.09em;margin-bottom:16px}
.card .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card .head h3{margin:0}

/* ---------- bandeau principal ---------- */
/* LE BANDEAU DU CAPITAL — la seule chose sur laquelle l'accueil mise.
   Le chiffre et sa courbe côte à côte : on voit le montant ET la trajectoire d'un
   coup d'œil. En dessous, les trois parts avec leur propre barre de proportion. */
/* le graphique d'évolution */
.lc{position:relative;width:100%;display:block}
.lc svg{display:block;max-width:100%}
.lc .dot{filter:drop-shadow(0 1px 2px rgba(20,26,22,.18))}
.lc .gl{stroke:var(--line-2);stroke-width:1;vector-effect:non-scaling-stroke}
.lc .gt{fill:var(--tx4);font-size:10.5px;font-weight:540;font-variant-numeric:tabular-nums;
        letter-spacing:.01em}
.lc .cross{stroke:var(--tx4);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.lc-tip{position:absolute;top:0;transform:translateX(-50%);pointer-events:none;
  background:var(--side);color:#F2F4F2;border-radius:8px;padding:5px 9px;white-space:nowrap;
  box-shadow:0 6px 18px -8px rgba(20,26,22,.5);z-index:2}
.lc-tip b{display:block;font-size:12.5px;font-weight:620;font-variant-numeric:tabular-nums}

.lc-leg{display:flex;flex-wrap:wrap;gap:22px;margin-top:14px;padding-left:56px}
.lc-leg span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx3)}
.lc-leg .sw{width:12px;height:12px;border-radius:3.5px;flex:0 0 12px}
/* les pastilles reprennent exactement les dégradés des aires du graphique */
.lc-leg .sw-verse{background:linear-gradient(180deg,#63BFD6,#1B4A6B)}
.lc-leg .sw-gain{background:linear-gradient(180deg,#5FD39A,#2C8C5B)}
.lc-leg b{color:var(--tx);font-weight:640;margin-left:2px}
@media(max-width:760px){ .lc-leg{padding-left:0;gap:14px} }
.lc-tip span{display:block;font-size:10.5px;color:#9AA39C;margin-top:1px}
.cap{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);
     box-shadow:var(--sh-2);overflow:hidden}
.cap-top{display:flex;align-items:center;gap:28px;padding:26px 28px 20px}
.cap-top > div:first-child{flex:0 0 auto}
.cap .lbl{font-size:11px;font-weight:650;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em}
.cap-big{font-size:46px;font-weight:680;letter-spacing:-.035em;line-height:1.02;margin-top:8px;
         color:var(--tx);font-variant-numeric:tabular-nums}
.cap-evo{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:12.5px;color:var(--tx3)}
.cap-graph{flex:1;min-width:0;align-self:stretch;display:flex;align-items:flex-end}

.cap-graph:empty{display:none}
/* les trois parts : une bande posée au bas du bandeau, sur fond légèrement teinté */
.cap-parts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
           background:var(--line-2);border-top:1px solid var(--line-2)}
.cpart{background:var(--surface);padding:15px 28px 17px}
.ck{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:580;color:var(--tx2)}
.ck i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.cv{font-size:21px;font-weight:650;letter-spacing:-.025em;color:var(--tx);margin-top:6px}
.cs{font-size:11.5px;color:var(--tx3);margin-top:3px}
.cbar{height:4px;border-radius:99px;background:var(--line-2);margin-top:9px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:99px}
@media (max-width:760px){
  .cap-top{flex-direction:column;align-items:stretch;gap:14px;padding:20px 18px 14px}
  .cap-big{font-size:38px}
  .cap-graph .chart{height:88px}
  .cap-parts{grid-template-columns:1fr}
  .cpart{padding:13px 18px 15px}
}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);
      padding:26px 28px;box-shadow:var(--sh-2);position:relative;overflow:hidden;
      display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.hero-main{flex:0 0 auto;min-width:250px;max-width:420px}
/* l'en-tête sépare visuellement l'argent disponible de l'argent placé */
.sbar{display:flex;gap:3px;height:8px;margin-top:16px;border-radius:99px;overflow:hidden;max-width:340px}
.sbar i{display:block;border-radius:99px}
.hero-split{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-self:stretch;
  align-items:center;padding-left:34px;border-left:1px solid var(--line-2);min-width:300px}
.hero-split .spart + .spart{padding-left:32px;border-left:1px solid var(--line-2)}
.spart .sk{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:560;color:var(--tx2);
  letter-spacing:.01em}
.spart .sk i{width:10px;height:10px;border-radius:3px;flex:0 0 9px}
.spart .sp{margin-left:auto;color:var(--tx4);font-weight:500;font-variant-numeric:tabular-nums}
.spart .sv{font-size:23px;font-weight:640;letter-spacing:-.025em;margin-top:5px;color:var(--tx)}
.spart .ss{font-size:12px;color:var(--tx3);margin-top:2px;text-wrap:pretty}
/* lien discret dans un en-tête de carte */
.lnk{font-size:12.5px;color:var(--tx3);padding:5px 9px;border-radius:8px;background:none;border:0;
  cursor:pointer;transition-property:color,background-color;transition-duration:130ms}
.lnk:hover{color:var(--acc);background:var(--acc-soft)}
/* carte secondaire : posée sur le fond, sans ombre — elle ne doit pas peser
   autant que la liste principale à côté d'elle */
/* « À surveiller » : la seule chose de l'accueil qui appelle une action.
   Un point coloré porte l'urgence, le texte reste sobre. */
.watch{display:flex;flex-direction:column;gap:2px}
.wrow{display:flex;gap:12px;align-items:flex-start;padding:10px 10px 10px 8px;border-radius:10px}
.wrow + .wrow{box-shadow:inset 0 1px 0 var(--line-2)}
.wrow[data-openacc]{cursor:pointer}
.wrow[data-openacc]:hover{background:var(--surface-2)}
.wrow > i{width:7px;height:7px;border-radius:99px;flex:0 0 7px;margin-top:6px;background:var(--tx4)}
.wrow.urgent > i{background:var(--neg)}
.wrow .wt{font-size:13.5px;font-weight:590;color:var(--tx);letter-spacing:-.005em;text-wrap:pretty}
.wrow .ws{font-size:12.5px;color:var(--tx3);margin-top:2px;text-wrap:pretty}
.wrow.urgent .ws{color:var(--neg)}
.card .head b.num{font-size:14px;font-weight:640;color:var(--tx);letter-spacing:-.015em}
.hero-alloc{flex:1;min-width:280px;padding-left:32px;border-left:1px solid var(--line-2)}
.hero-alloc:empty{display:none}
.hero .lbl{font-size:11px;font-weight:650;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em}
.hero .big{font-size:46px;font-weight:640;letter-spacing:-.035em;margin:10px 0 0;line-height:1.02}
.hero .delta{font-size:13px;color:var(--tx2);margin-top:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
      font-size:12px;font-weight:600;letter-spacing:-.01em}
.chip.up{background:#E3F2EA;color:var(--pos)}
.chip.down{background:#FBEAE5;color:var(--neg)}
.chip.flat{background:var(--surface-2);color:var(--tx3)}
.chip svg{width:12px;height:12px}

/* ---------- indicateurs ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
      padding:16px 18px;box-shadow:var(--sh-1)}
.stat .k{font-size:11px;font-weight:650;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.stat .v{font-size:24px;font-weight:640;letter-spacing:-.03em;line-height:1.1}
.stat .cmp{font-size:11.5px;font-weight:500;color:var(--tx3);margin-top:7px}
.stat .cmp.pos{color:var(--pos)}
.stat .cmp.negv{color:var(--neg)}

/* une catégorie par ligne : libellé, barre, montant, part */
.catlist{display:flex;flex-direction:column}
.cline{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(90px,2fr) auto 46px;
       align-items:center;gap:14px;padding:9px 0}
.cline + .cline{box-shadow:inset 0 1px 0 var(--line-2)}
.cn{display:flex;align-items:center;gap:9px;font-size:13px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.cb{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden}
.cb i{display:block;height:100%;border-radius:99px;
      transition-property:width;transition-duration:350ms;transition-timing-function:cubic-bezier(.22,1,.36,1)}
.cv{font-size:13.5px;font-weight:600;letter-spacing:-.02em;text-align:right;white-space:nowrap}
.cp{font-size:12px;color:var(--tx3);text-align:right}

/* ---------- répartition ---------- */
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:132px;height:132px;flex:0 0 132px}
.donut-c{font-size:15px;font-weight:650;letter-spacing:-.02em;fill:var(--tx)}
.donut-s{font-size:9px;font-weight:650;letter-spacing:.09em;fill:var(--tx3);text-transform:uppercase}
.dlegend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:9px}
.dlegend div{display:flex;align-items:center;gap:9px;font-size:13px}
.dlegend i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.dlegend .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.dlegend .a{font-weight:600;letter-spacing:-.01em}
.dlegend .p{color:var(--tx3);font-size:12px;min-width:34px;text-align:right}

/* ---------- liste de comptes ---------- */
.alist{display:flex;flex-direction:column}
.agroup{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
        padding:18px 2px 7px;font-size:10.5px;font-weight:620;color:var(--tx4);
        text-transform:uppercase;letter-spacing:.1em}
.agroup:first-child{padding-top:0}
.agroup b{font-size:12.5px;letter-spacing:-.01em;text-transform:none;color:var(--tx2);font-weight:600;
          font-variant-numeric:tabular-nums}
.arow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer;
      transition-property:background-color;transition-duration:120ms}
.arow:hover{background:var(--surface-2)}
.arow:active{background:var(--line-2)}
.arow .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px}
.arow .ic svg{width:15px;height:15px}
.arow .mid{flex:1;min-width:0}
.arow .nm{font-size:13.5px;font-weight:520;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .sb{font-size:11.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.arow .amt{font-size:14.5px;font-weight:640;letter-spacing:-.02em;white-space:nowrap}
.arow .amt.negv{color:var(--neg)}
.arow.add{justify-content:center;color:var(--tx3);border:1px dashed var(--line);margin-top:12px;
          padding:10px;font-size:12.5px;gap:7px}
.arow.add svg{width:14px;height:14px}
.arow.add:hover{color:var(--acc);border-color:var(--acc);background:transparent}

/* ---------- opérations ---------- */
.list{display:flex;flex-direction:column}
.daylbl{font-size:10.5px;color:var(--tx4);font-weight:620;padding:18px 2px 7px;
        text-transform:uppercase;letter-spacing:.1em}
.list > .daylbl:first-child{padding-top:0}
.row{position:relative;display:flex;align-items:center;gap:13px;padding:9px 24px 9px 10px;border-radius:10px;
     transition-property:background-color;transition-duration:120ms}
.list .row + .row{box-shadow:inset 0 1px 0 var(--line-2)}
.row.clickable{cursor:pointer}
.row:hover{background:var(--surface-2)}
.row.clickable:active{background:var(--line-2)}
.row .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 32px}
.row .ic svg{width:15px;height:15px}
.row .mid{flex:1 1 auto;min-width:110px;max-width:540px}
.row .l1{font-size:13.5px;font-weight:520;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l2{font-size:11.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row .amt{font-size:14.5px;font-weight:640;letter-spacing:-.02em;white-space:nowrap;
          min-width:96px;text-align:right}
.row .amt.tr{color:var(--tx2);font-weight:550}      /* un virement n'est ni un gain ni une perte */
.row .col-cat,.row .col-acc{display:none}
.row .col-cat{flex:0 1 172px;min-width:0}
.row .col-acc{flex:0 1 200px;min-width:0;font-size:12.5px;color:var(--tx3);
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
"use strict";

/* ============================ persistance ============================ */
const Store = {
  warned: false,
  loadError: null,

  save(data){
    const json = JSON.stringify(data);
    let ecrit = false;
    try{ localStorage.setItem("budget-v1", json); ecrit = true; }catch(e){}
    // le pont natif n'existe pas hors de l'app macOS : son absence est normale
    try{ window.webkit.messageHandlers.store.postMessage(json); ecrit = true; }catch(e){}

    // un échec des deux côtés signifie que la modification est perdue : il faut le dire
    if (!ecrit && !this.warned){
      this.warned = true;
      toast("Enregistrement impossible — sauvegarde tes données depuis le menu");
    }
    return ecrit;
  },

  load(){
    if (window.__DATA__ && window.__DATA__.accounts) return window.__DATA__;
    let raw = null;
    try{ raw = localStorage.getItem("budget-v1"); }catch(e){}
    if (!raw) return null;
    try{
      return JSON.parse(raw);
    }catch(e){
      // données illisibles : on les met de côté au lieu de repartir de zéro et de les écraser
      try{ localStorage.setItem("budget-v1-illisible-" + Date.now(), raw); }catch(_){}
      this.loadError = "Les données enregistrées étaient illisibles. Une copie a été mise de côté ;"
                     + " restaure une sauvegarde depuis la barre latérale.";
      return null;
    }
  }
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* LA palette de l'app — une seule, pour les catégories, les types de compte et les
   répartitions. Neuf teintes, de l'orange brûlé à l'ardoise, en évitant les prunes et
   les roses qui jureraient avec l'ivoire.
   Ce qui compte ici c'est l'AMPLITUDE DE CLARTÉ (0,42 à 0,66). Une première version
   tenait la clarté serrée pour que tout « aille ensemble » : les teintes s'accordaient
   mais devenaient indiscernables — à écart net, il n'en restait que 4 sur 12. C'est la
   clarté, pas la sobriété, qui sépare deux couleurs voisines.
   Garanties vérifiées par les tests : aucun doublon, contraste ≥ 3:1 sur l'ivoire,
   aucune teinte à moins de 11 du vert de marque ni du rouge des pertes — sans quoi
   « le vert de l'app » et « le vert d'une catégorie » se confondent.
   L'ordre place les plus contrastées côte à côte : les catégories reçoivent des index
   qui se suivent. */
const PALETTE = ["#3C5D96","#A9873E","#694324","#6D8BC9","#63955B","#223F5B","#53767A","#577431","#349091"];
/* les entrées piochent dans la même palette, décalées : une entrée et une dépense
   côte à côte ne portent jamais la même couleur */
const PALETTE_IN = PALETTE.slice(4).concat(PALETTE.slice(0,4));
const ALLOC_PALETTE = PALETTE;   // même palette : une couleur veut dire une seule chose
const DEF_OUT = ["Courses","Restau / sorties","Transport","Abonnements","Vêtements","Jeux / loisirs","Tech","Cadeaux","Santé","Autre"];
const DEF_IN  = ["Argent de poche","Job / petit boulot","Cadeau reçu","Remboursement","Vente","Autre"];

function mkCat(name, i, side){

}

/** enregistre, horodate, et programme un envoi vers Google Drive si la synchro est active */
let pushTimer = null;
/* save() marque une VRAIE modification : il avance updatedAt et rev, ce qui donne
   la priorité à cet appareil lors de la prochaine synchronisation. Une migration ou
   une écriture technique doit passer par Store.save(S) et surtout pas par ici. */
function save(){
  S.updatedAt = new Date().toISOString();
  S.rev = (S.rev || 0) + 1;
  S.schema = SCHEMA;
  Store.save(S);
  // save() est appelé par les migrations, avant que Sync ne soit défini.
  // `typeof` ne protège pas d'une zone morte temporelle : il faut intercepter.
  try {
    if (Sync.on()){
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => Sync.push(), 4000);
    }
  } catch (e){ /* démarrage : la synchronisation partira au prochain changement */ }
}

/* mises à jour du format entre deux versions */
function migrateState(){
  let changed = false;

  // les cours étaient stockés pour le seul S&P 500 ; ils sont désormais indexés par symbole
  if (!S.quotes){
    S.quotes = {};
    if (S.spx && S.spx.series && Object.keys(S.spx.series).length){
      S.quotes["^GSPC"] = { updated:S.spx.updated, last:S.spx.last, currency:"USD",
                            name:"S&P 500", series:S.spx.series };
    }
    delete S.spx;
    changed = true;
  }
  if (!S.recurring){ S.recurring = []; changed = true; }
  S.accounts.forEach(a => {
    if (a.kind === "invest" && a.symbol === undefined){ a.symbol = "^GSPC"; changed = true; }
  });

  const lj = S.accounts.find(a => a.id === "a_epargne" && a.name === "Livret jeune");
  if (lj && !lj.start && !S.tx.some(t => t.from === lj.id || t.to === lj.id)
        && !S.marks.some(m => m.accountId === lj.id)){
    S.accounts = S.accounts.filter(a => a.id !== lj.id); changed = true;
  }
  S.accounts.forEach(a => {
    if (a.kind !== "credit" && /carte\s*(de\s*)?cr[ée]dit/i.test(a.name)){ a.kind = "credit"; changed = true; }
  });
  if (!S.cats){ S.cats = { out: DEF_OUT.map((c,i) => mkCat(c,i,"out")), in: DEF_IN.map((c,i) => mkCat(c,i,"in")) }; changed = true; }
  ["out","in"].forEach(side => {
    const names = new Set(S.cats[side].map(c => c.name));
    S.tx.filter(t => t.type === side && t.cat && !names.has(t.cat)).forEach(t => {
      S.cats[side].push(mkCat(t.cat, S.cats[side].length, side));
      names.add(t.cat); changed = true;
    });
  });
  // Passe unique : l'ancienne palette mélangeait des clartés et des saturations
  // sans système, et attribuait parfois deux fois la même teinte. On repart de la
  // palette OKLCH, une fois pour toutes. Les couleurs choisies ensuite sont gardées.
  if (!S.catsV5){
    for (const side of ["out","in"]){
      const pal = side === "in" ? PALETTE_IN : PALETTE;
      (S.cats[side] || []).forEach((c, i) => { c.color = pal[i % pal.length]; });
    }
    S.catsV5 = true; changed = true;
  }
  if (!S.planned) S.planned = [];
  if (!S.sync) S.sync = { enabled:false, last:null };
  if (changed){ S.v = 3; Store.save(S); }   // surtout pas save() : voir plus bas
}
migrateState();

/** comptes qui se valorisent (cours de bourse ou montant relevé), par opposition aux comptes bancaires */
const ASSET_KINDS = ["invest", "immo"];
const isAsset = a => !!a && ASSET_KINDS.includes(a.kind);

const acc  = id => S.accounts.find(a => a.id === id);
const kind = id => KINDS[(acc(id)||{}).kind] || KINDS.courant;
/** un placement est chez une plateforme, un compte est dans une banque */

function balance(id){
  const a = acc(id); if (!a) return 0;
  let b = a.start || 0;
  for (const t of S.tx){
    if (t.type === "in"  && t.to   === id) b += t.amount;
    if (t.type === "out" && t.from === id) b -= t.amount;
    if (t.type === "tr"){
      if (t.from === id) b -= t.amount;
      if (t.to   === id) b += t.amount;
    }
  }
  return Math.round(b * 100) / 100;
}
function invested(id){
  let v = (acc(id)||{}).start || 0;
  for (const t of S.tx){
    if (t.to === id && (t.type === "tr" || t.type === "in")) v += t.amount;
    if (t.from === id && (t.type === "tr" || t.type === "out")) v -= t.amount;
  }
  return Math.round(v * 100) / 100;
}
function lastMark(id){
  const m = S.marks.filter(m => m.accountId === id).sort((a,b) => a.date.localeCompare(b.date));
  return m.length ? m[m.length-1] : null;
}
function contribsAfter(id, date){
  let v = 0;
  for (const t of S.tx){
    if (t.date <= date) continue;
    if (t.to === id && (t.type === "tr" || t.type === "in")) v += t.amount;
    if (t.from === id && (t.type === "tr" || t.type === "out")) v -= t.amount;
  }

/* ---------- cours des placements ---------- */
const symOf = id => (acc(id) || {}).symbol || null;   // null = pas de cours suivi
const quote  = sym => (sym && (S.quotes || {})[sym]) || null;
const qDates = sym => { const q = quote(sym); return q ? Object.keys(q.series || {}).sort() : []; };

/** cours à une date : la séance du jour, sinon la dernière connue avant.
    Au-delà de la dernière séance de l'historique, on prend le cours du moment. */
function priceAt(sym, date){
  const q = quote(sym); if (!q) return null;
  const s = q.series || {};
  const keys = qDates(sym);
  if (!keys.length) return q.last != null ? q.last : null;
  if (date > keys[keys.length-1] && q.last != null) return q.last;
  if (s[date]) return s[date];
  let best = null;
  for (const k of keys){ if (k <= date) best = k; else break; }
  return best ? s[best] : s[keys[0]];
}
const priceNow = sym => { const q = quote(sym); return (q && q.last) || priceAt(sym, todayISO()); };

/** taux de change : combien d'unités de `cur` pour 1 euro, à une date donnée */
const fxSymbol = cur => "EUR" + cur + "=X";
function fxAt(cur, date){
  if (!cur || cur === "EUR") return 1;
  return priceAt(fxSymbol(cur), date);
}
/** cours d'un placement converti en euros */
function priceEUR(sym, date){
  const p = priceAt(sym, date);
  if (p == null) return null;
  const cur = (quote(sym) || {}).currency || "EUR";
  const fx = fxAt(cur, date);
  return fx ? p / fx : null;
}
/** le cours de ce placement a-t-il besoin d'un taux de change qu'on n'a pas encore ? */
function missingFx(sym){
  const cur = (quote(sym) || {}).currency;
  return !!cur && cur !== "EUR" && !quote(fxSymbol(cur));
}

/**
 * Points d'ancrage d'un placement : chaque somme dont on connaît la valeur à une date.
 * Le dernier montant réel noté, puis tous les versements faits après lui.
 * Sans montant noté, les versements suffisent : investir 400 € le 15, c'est 400 € le 15.
 */
function anchorsOf(id, upto){
  const m = lastMark(id);
  const out = [];
  if (m && m.date <= upto) out.push({ date:m.date, amount:m.value });
  for (const t of S.tx){
    if (t.date > upto) continue;
    if (m && t.date <= m.date) continue;          // déjà compris dans le montant noté
    const into  = (t.to === id   && (t.type === "tr" || t.type === "in"));
    const outOf = (t.from === id && (t.type === "tr" || t.type === "out"));
    if (!into && !outOf) continue;
    out.push({ date:t.date, amount: into ? t.amount : -t.amount });
  }
  return out;
}
const firstAnchorDate = id => {
  const a = anchorsOf(id, FAR);
  return a.length ? a.reduce((mn,x) => x.date < mn ? x.date : mn, "9999-12-31") : null;
};

/** valeur estimée d'un placement à une date : chaque ancre suit le cours depuis sa propre date */
/** intérêts courus, non composés, au prorata des jours écoulés */
const ANNEE = 365;
function valeurAvecTaux(anchors, taux, fin){
  let v = 0;
  for (const a of anchors){
    const jours = Math.max(0, (new Date(fin + "T12:00:00") - new Date(a.date + "T12:00:00")) / 86400000);
    v += a.amount * (1 + (taux / 100) * (jours / ANNEE));
  }
  return Math.round(v * 100) / 100;
}

function valueAt(id, date){
  const anchors = anchorsOf(id, date);
  if (!anchors.length) return Math.round(((acc(id) || {}).start || 0) * 100) / 100;
  const plain = anchors.reduce((s,a) => s + a.amount, 0);
  const sym = symOf(id);
  // un projet immobilier ne suit pas un cours : il rapporte un taux annuel connu d'avance
  const taux = (acc(id) || {}).rate;
  if (!sym && taux > 0) return valeurAvecTaux(anchors, taux, date === FAR ? todayISO() : date);
  // au-delà de l'historique connu, on valorise au cours du jour
  const px = priceEUR(sym, date === FAR ? todayISO() : date);
  if (px == null) return Math.round(plain * 100) / 100;
  let v = 0;
  for (const a of anchors){
    const p0 = priceEUR(sym, a.date);
    v += p0 ? a.amount * (px / p0) : a.amount;
  }
  return Math.round(v * 100) / 100;
}

/* Valeur du jour : on retient TOUTES les sommes enregistrées, même datées en avance.
   Sinon un virement mal daté sortirait du compte source sans entrer dans le placement,
   et le patrimoine total perdrait cet argent. Le filtrage par date ne sert qu'aux courbes. */
const FAR = "9999-12-31";

function investEstimate(id){
  const anchors = anchorsOf(id, FAR);
  const sym = symOf(id);
  const px = priceEUR(sym, todayISO());
  const taux = (acc(id) || {}).rate;
  if (!sym && taux > 0) return { value: valueAt(id, FAR), live: anchors.length > 0, asOf: null, taux };
  return { value: valueAt(id, FAR),
           live: px != null && anchors.length > 0,
           asOf: (quote(sym) || {}).updated };
}

function value(id){
  const a = acc(id); if (!a) return 0;
  return isAsset(a) ? investEstimate(id).value : balance(id);
}

/** somme réellement placée : montant noté le plus récent + versements postérieurs */
/* CE QU'IL A RÉELLEMENT MIS.
   Un montant noté sert à deux choses très différentes : le PREMIER dit « voilà ce que
   j'ai investi », les suivants disent « voilà ce que ça vaut maintenant ». Se baser sur
   le dernier, comme avant, faisait que la moindre réévaluation réécrivait la mise de
   départ : il avait investi 400 €, ça descend à 395 €, et l'app annonçait « 395 € placés,
   0 € de gain » au lieu de « 400 € placés, −5 € ». */
function investRef(id){
  const marks = S.marks.filter(m => m.accountId === id)
                  .sort((a,b) => a.date.localeCompare(b.date));
  const premier = marks[0] || null;
  let total = premier ? premier.value : 0;
  for (const t of S.tx){
    // ce qui précède le premier montant noté est déjà compris dedans
    if (premier && t.date <= premier.date) continue;
    const into  = (t.to === id   && (t.type === "tr" || t.type === "in"));
    const outOf = (t.from === id && (t.type === "tr" || t.type === "out"));
    if (into) total += t.amount;
    else if (outOf) total -= t.amount;
  }
  if (!premier && !total) return Math.round(((acc(id) || {}).start || 0) * 100) / 100;
  return Math.round(total * 100) / 100;
}

/** la date à laquelle il a commencé à mettre de l'argent sur ce placement */
function debutPlacement(id){
  const marks = S.marks.filter(m => m.accountId === id).map(m => m.date);
  const vers  = S.tx.filter(t => t.to === id || t.from === id).map(t => t.date);
  const tout = marks.concat(vers).sort();
  return tout.length ? tout[0] : null;
}
/** solde d'un compte bancaire à une date donnée */
function soldeAt(id, date){
  const a = acc(id); if (!a) return 0;
  let b = a.start || 0;
  for (const t of S.tx){
    if (t.date > date) continue;
    if (t.type === "in"  && t.to   === id) b += t.amount;
    if (t.type === "out" && t.from === id) b -= t.amount;
    if (t.type === "tr"){
      if (t.from === id) b -= t.amount;
      if (t.to   === id) b += t.amount;
    }
  }
  return Math.round(b * 100) / 100;
}

/** le patrimoine complet à une date : comptes au solde de l'époque, placements au cours de l'époque */
function patrimoineAt(date){
  return Math.round(S.accounts.reduce((s,a) =>
    s + (isAsset(a) ? valueAt(a.id, date) : soldeAt(a.id, date)), 0) * 100) / 100;
}

/** la période couverte par la courbe, calée sur le sélecteur Jour / Mois / Année / Tout */
function fenetreCourbe(){
  const [a, b] = periodBounds();
  const auj = todayISO();
  const fin = b > auj ? auj : b;
  const tout = S.tx.map(t => t.date).concat(S.marks.map(m => m.date)).sort();
  const origine = tout.length ? tout[0] : shiftDays(fin, -365);

  if (P.mode === "all") return { debut: origine, fin, libelle: "depuis le début" };

  // Un mois qui vient de commencer ne fait pas une courbe. On garde le sens du
  // sélecteur mais on garantit assez de matière pour qu'il y ait quelque chose à lire.
  const mini = P.mode === "day" ? 30 : P.mode === "month" ? 30 : 120;
  const debutVoulu = P.mode === "day" ? shiftDays(fin, -30) : a;
  const jours = Math.round((new Date(fin+"T12:00:00") - new Date(debutVoulu+"T12:00:00")) / 86400000);
  const debut = jours >= mini ? debutVoulu : shiftDays(fin, -mini);
  const vrai = debut < origine ? origine : debut;

  const libelle = P.mode === "day" ? "30 derniers jours"
                : jours >= mini ? periodLabel().toLowerCase()
                : (P.mode === "month" ? "30 derniers jours" : "4 derniers mois");
  return { debut: vrai, fin, libelle };
}

/** la courbe du patrimoine sur la période affichée — le chiffre qui l'intéresse */
function patrimoineSeries(){
  const { debut, fin } = fenetreCourbe();
  const jours = Math.round((new Date(fin+"T12:00:00") - new Date(debut+"T12:00:00")) / 86400000);
  if (jours < 3) return [];
  const pas = Math.max(1, Math.round(jours / 60));
  const pts = [];
  for (let d = debut; d <= fin; d = shiftDays(d, pas)) pts.push({ d, y: patrimoineAt(d) });
  if (pts[pts.length-1].d !== fin) pts.push({ d: fin, y: patrimoineAt(fin) });
  return pts.length >= 3 ? pts : [];
}

const netWorth = () => Math.round(S.accounts.reduce((s,a) => s + value(a.id), 0) * 100) / 100;

const sum = (list, type) => list.reduce((s,t) => s + (t.type === type && !t.adj ? t.amount : 0), 0);

/* ============================ formats ============================ */
const eur = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2});
const eur0 = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
// Intl écrit un trait d'union, nos libellés un vrai signe moins : on unifie sur le signe moins
const moins = t => t.replace(/^-/, "−");
const fmt  = n => moins(eur.format(n || 0));
const fmtS = n => (n > 0 ? "+" : "") + moins(eur.format(n || 0));
const pct  = n => (n > 0 ? "+" : "") + n.toFixed(1).replace(".", ",") + " %";

const MONTHS   = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MONTHS_S = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const ymOf = d => d.slice(0,7);
const monthLabel = ym => { const [y,m] = ym.split("-"); return MONTHS[+m-1] + " " + y; };
function shiftYM(ym, delta){
  const [y,m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
const lastDayOfMonth = ym => {
  const [y,m] = ym.split("-").map(Number);
  return ym + "-" + String(new Date(y, m, 0).getDate()).padStart(2,"0");
};
function shiftDays(iso, n){
  const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n);
  return d.toLocaleDateString("sv-SE");
}
const daysBetween = (a,b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000);
const shortDate = iso => (+iso.slice(8)) + " " + MONTHS_S[+iso.slice(5,7)-1];
const longDate  = iso => (+iso.slice(8)) + " " + MONTHS[+iso.slice(5,7)-1] + " " + iso.slice(0,4);
function dayLabel(iso){
  if (iso === todayISO()) return "Aujourd'hui";
  if (iso === shiftDays(todayISO(), -1)) return "Hier";
  return new Date(iso + "T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg = (p, w) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';

/* ============================ période ============================ */
const P = { mode:"month", anchor: todayISO() };

function dataBounds(){
  const dates = S.tx.map(t => t.date).sort();
  return dates.length ? [dates[0], dates[dates.length-1]] : [todayISO(), todayISO()];
}
function periodBounds(){
  if (P.mode === "day")   return [P.anchor, P.anchor];
  if (P.mode === "month"){ const ym = ymOf(P.anchor); return [ym + "-01", lastDayOfMonth(ym)]; }
  if (P.mode === "year"){  const y = P.anchor.slice(0,4); return [y + "-01-01", y + "-12-31"]; }
  return dataBounds();
}
const inPeriod = t => { const [a,b] = periodBounds(); return t.date >= a && t.date <= b; };
const periodTx = () => S.tx.filter(inPeriod);

function periodLabel(){
  const [a,b] = periodBounds();
  if (P.mode === "day")   return P.anchor === todayISO() ? "Aujourd'hui" : longDate(P.anchor);
  if (P.mode === "month") return monthLabel(ymOf(P.anchor));
  if (P.mode === "year")  return P.anchor.slice(0,4);
  return "Depuis le début";
}
function shiftPeriod(d){
  if (P.mode === "day")   P.anchor = shiftDays(P.anchor, d);
  else if (P.mode === "month") P.anchor = shiftYM(ymOf(P.anchor), d) + "-01";
  else if (P.mode === "year")  P.anchor = (+P.anchor.slice(0,4) + d) + "-01-01";
}

/** découpe la période en tranches : jour, mois ou année selon sa longueur */
function bucketize(){
  const [a,b] = periodBounds();
  const span = daysBetween(a,b);
  let grain = span <= 45 ? "day" : (span <= 800 ? "month" : "year");

  // un mois avec deux jours mouvementés donnait 31 colonnes pour 2 barres :
  // on regroupe par semaine dès que les jours actifs se comptent sur les doigts
  if (grain === "day" && span > 12){
    const jours = new Set(periodTx().filter(t => !t.adj && t.type !== "tr").map(t => t.date));
    if (jours.size <= 7) grain = "week";
  }

  const buckets = new Map();
  const lundi = d => shiftDays(d, -(((new Date(d + "T12:00:00").getDay() + 6) % 7)));
  const keyOf = d => grain === "day" ? d
                   : grain === "week" ? lundi(d)
                   : grain === "month" ? ymOf(d) : d.slice(0,4);
  // la semaine du 1er août commence le 27 juillet : on n'affiche pas une date
  // hors de la période consultée, on étiquette le premier jour visible
  const labelOf = k => grain === "day" ? String(+k.slice(8))
                     : grain === "week" ? (d => (+d.slice(8)) + " " + MONTHS_S[+d.slice(5,7)-1])(k < a ? a : k)
                     : grain === "month" ? MONTHS_S[+k.slice(5,7)-1] : k;

  if (grain === "day"){
    for (let d = a; d <= b; d = shiftDays(d,1)) buckets.set(d, { in:0, out:0 });
  } else if (grain === "week"){
    for (let d = lundi(a); d <= b; d = shiftDays(d,7)) buckets.set(d, { in:0, out:0 });
  } else if (grain === "month"){
    for (let m = ymOf(a); m <= ymOf(b); m = shiftYM(m,1)) buckets.set(m, { in:0, out:0 });
  } else {
    for (let y = +a.slice(0,4); y <= +b.slice(0,4); y++) buckets.set(String(y), { in:0, out:0 });
  }
  for (const t of periodTx()){
    if (t.adj || t.type === "tr") continue;
    const s2 = buckets.get(keyOf(t.date));
    if (s2) s2[t.type] += t.amount;
  }
  return [...buckets.entries()].map(([k,v]) => ({ key:k, label:labelOf(k), in:v.in, out:v.out }));
}

/** mêmes chiffres sur la période précédente, pour donner un point de comparaison */
function previousTotals(){
  if (P.mode === "all") return null;
  const memo = { mode:P.mode, anchor:P.anchor };
  shiftPeriod(-1);
  const l = periodTx();
  const r = { in: sum(l, "in"), out: sum(l, "out") };
  P.mode = memo.mode; P.anchor = memo.anchor;
  return r;
}

/** « +12 % » ou « −8 % » face à la période précédente, ou rien si la comparaison n'a pas de sens */
function compareLine(now, before, moinsCestMieux){
  // sans historique, on ne compare pas — l'appelant fournit un repli calculable
  if (before == null || !before) return null;
  const pc = Math.round((now - before) / before * 100);
  if (pc === 0) return '<div class="cmp">identique à la période précédente</div>';
  const bon = moinsCestMieux ? pc < 0 : pc > 0;
  return '<div class="cmp ' + (bon ? "pos" : "negv") + '">'
    + (pc > 0 ? "+" : "−") + Math.abs(pc) + ' % vs période précédente</div>';
}


/** replis affichés quand il n'y a pas encore de période précédente à comparer */
function statInfos(list, inM, outM){
  const nIn  = list.filter(t => t.type === "in").length;
  const nOut = list.filter(t => t.type === "out").length;
  const jours = Math.max(1, periodDays());
  const parJour = (inM - outM) / jours;
  return [
    nIn  ? nIn  + " opération" + (nIn  > 1 ? "s" : "")  : "aucune entrée",
    nOut ? nOut + " opération" + (nOut > 1 ? "s" : "") + " · " + fmt(outM / nOut) + " en moyenne"
         : "aucune dépense",
    fmtS(parJour) + " par jour"
  ];
}

/** nombre de jours couverts par la période affichée, jamais au-delà d'aujourd'hui */
function periodDays(){
  const [a,b] = periodBounds();
  const fin = b > todayISO() ? todayISO() : b;
  if (fin < a) return 1;
  return Math.max(1, Math.round((new Date(fin) - new Date(a)) / 86400000) + 1);
}

/** comptes regroupés par banque (ou par type quand la banque n'est pas renseignée) */
function accountGroups(filtre){
  const map = new Map();
  for (const a of S.accounts.filter(filtre || (() => true))){
    const label = (a.bank || "").trim() || (KINDS[a.kind] || KINDS.courant).label;
    if (!map.has(label)) map.set(label, []);
    map.get(label).push(a);
  }
  return [...map.entries()]
    .map(([name, accs]) => ({
      name, accs,
      total: Math.round(accs.reduce((s,a) => s + value(a.id), 0) * 100) / 100
    }))
    .sort((x,y) => y.total - x.total)
    .map((g,i) => Object.assign(g, { color: ALLOC_PALETTE[i % ALLOC_PALETTE.length] }));
}

/** anneau de répartition du patrimoine + légende chiffrée */
/** placements regroupés par plateforme — même forme que accountGroups() */
function holdingGroups(){
  const map = new Map();
  for (const a of S.accounts.filter(isAsset)){
    const label = (a.bank || "").trim() || (KINDS[a.kind] || KINDS.invest).label;
    if (!map.has(label)) map.set(label, []);
    map.get(label).push(a);
  }
  return [...map.entries()]
    .map(([name, accs]) => ({ name, accs,
      total: Math.round(accs.reduce((s,a) => s + value(a.id), 0) * 100) / 100 }))
    .sort((x,y) => y.total - x.total)
    .map((g,i) => Object.assign(g, { color: ALLOC_PALETTE[i % ALLOC_PALETTE.length] }));
}

function donutChart(groups){
  const pos = groups.filter(g => g.total > 0);
  const tot = pos.reduce((s,g) => s + g.total, 0);
  if (!tot) return "";

  const R = 52, W = 16, C = 2 * Math.PI * R;
  const gap = pos.length > 1 ? 2.5 : 0;
  let off = 0;
  const segs = pos.map(g => {
    const len = Math.max(g.total / tot * C - gap, 0.5);
    const el = '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + g.color + '"'
      + ' stroke-width="' + W + '" stroke-linecap="butt"'
      + ' stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '"'
      + ' stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)"/>';
    off += g.total / tot * C;
    return el;
  }).join("");

  return '<div class="donut-wrap">'
    + '<svg class="donut" viewBox="0 0 140 140">'
      + '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--line-2)" stroke-width="' + W + '"/>'
      + segs
      + '<text class="donut-s" x="70" y="64" text-anchor="middle">Total</text>'
      + '<text class="donut-c" x="70" y="82" text-anchor="middle">' + esc(eur0.format(tot)) + '</text>'
    + '</svg>'
    + '<div class="dlegend">'
      + pos.map(g => '<div><i style="background:' + g.color + '"></i>'
          + '<span class="n">' + esc(g.name) + '</span>'
          + '<span class="a num">' + fmt(g.total) + '</span>'
          + '<span class="p num">' + Math.round(g.total / tot * 100) + '%</span></div>').join("")
    + '</div></div>';
}

/** petite pastille verte/rouge avec la flèche, comme dans les apps de banque */
function deltaChip(n){
  const nul = Math.abs(n) < 0.005;
  if (nul) return '<span class="chip flat">' + fmt(0) + '</span>';
  const up = n > 0;
  const arrow = up ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M12 5v14M19 12l-7 7-7-7"/>';
  return '<span class="chip ' + (up ? "up" : "down") + '">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'
    + arrow + '</svg>' + moins(fmtS(n)) + '</span>';
}

/** minuscules sans accents, pour comparer un nom de compte à son type */
const plainTxt = s => String(s || "").toLowerCase()
  .replace(/[àâä]/g,"a").replace(/[éèêë]/g,"e").replace(/[îï]/g,"i")
  .replace(/[ôö]/g,"o").replace(/[ùûü]/g,"u").replace(/ç/g,"c");

function accountRow(a, sansBanque){
  const k = KINDS[a.kind] || KINDS.courant;
  const v = value(a.id);
  let sb = "";
  if (isAsset(a)){
    const ref = investRef(a.id), g = v - ref;
    // un gain nul n'apprend rien : on ne montre la ligne que s'il y a du mouvement
    if (ref > 0 && Math.abs(g) >= 0.01) sb = fmtS(g) + " · " + pct(g / ref * 100);
    else if (ref <= 0) sb = "montant à noter";
  } else {
    // « Compte courant CBC » n'a pas besoin qu'on lui répète « Compte courant »
    const mot = plainTxt(k.label).split(" ").pop();
    if (!plainTxt(a.name).includes(mot)) sb = k.label;
  }
  // « CBC » figure déjà en tête de groupe : inutile de le répéter sur chaque ligne
  let nom = a.name;
  if (sansBanque && a.bank){
    const court = nom.replace(new RegExp("\\s*" + a.bank.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*$", "i"), "").trim();
    if (court) nom = court;
  }
  return '<div class="arow" data-openacc="' + a.id + '">'
    + '<div class="ic" style="background:' + k.color + '1f;color:' + k.color + '">' + svg(k.icon, 2) + '</div>'
    + '<div class="mid"><div class="nm">' + esc(nom) + '</div>'
      + (sb ? '<div class="sb">' + esc(sb) + '</div>' : "") + '</div>'
    + '<div class="amt num' + (v < 0 ? " negv" : "") + '">' + fmt(v) + '</div></div>';
}

/* L'ACCUEIL RÉPOND À TROIS QUESTIONS, DANS CET ORDRE :
     1. combien je peux dépenser maintenant       → le bandeau
     2. qu'est-ce qui demande une action           → « À surveiller »
     3. où est mon argent                          → mes comptes, mes placements
   Ce qui a été RETIRÉ : la bande Entrées/Dépenses/Reste (elle est déjà sur Bilan et sur
   Opérations) et la longue liste d'opérations (c'est toute la page Opérations). L'accueil
   ne doit pas être un échantillon des autres pages, sinon il ne sert à rien. */

/** l'argent réellement disponible : comptes courants et liquide, pas l'épargne ni les placements */
const DISPONIBLE = ["courant", "cash", "credit"];
const estDispo = a => DISPONIBLE.includes(a.kind);

/** ce qui demande une action, du plus urgent au moins urgent */
function aSurveiller(){
  const out = [];

  // un solde négatif, c'est de l'argent dû
  for (const a of S.accounts.filter(x => !isAsset(x))){
    const v = value(a.id);
    if (v < -0.005){
      out.push({ ton:"urgent", titre: esc(a.name),
                 texte: fmt(Math.abs(v)) + (a.kind === "credit" ? " à rembourser" : " à découvert"),
                 acc: a.id });
    }
  }

  // les versements planifiés à une date précise, s'ils arrivent bientôt
  for (const r of (S.planned || [])){
    if (r.done) continue;
    const dans = Math.round((new Date(r.date+"T12:00:00") - new Date(todayISO()+"T12:00:00")) / 86400000);
    if (dans < 0 || dans > 14) continue;
    const dest = (acc(r.to) || {}).name || "un placement";
    out.push({ ton:"info", titre: fmt(r.amount) + " vers " + esc(dest),
               texte: (dans === 0 ? "aujourd'hui" : dans === 1 ? "demain" : "dans " + dans + " jours")
                      + " · versement planifié" });
  }

  // les versements automatiques qui tombent dans les dix jours
  const auj = new Date(todayISO() + "T12:00:00"), jourAuj = auj.getDate();
  for (const r of (S.recurring || [])){
    let dans = r.day - jourAuj;
    if (dans < 0) dans += 30;
    if (dans > 10) continue;
    const dest = (acc(r.to) || {}).name || "un placement";
    out.push({ ton:"info", titre: fmt(r.amount) + " vers " + esc(dest),
               texte: dans === 0 ? "aujourd'hui" : dans === 1 ? "demain" : "dans " + dans + " jours" });
  }

  // le rythme de dépense, projeté sur le mois entier
  const p = rythmeDuMois();
  if (p) out.push(p);
  return out;
}

/** « à ce rythme, tu finiras le mois à X € » — comparé au mois précédent */
function rythmeDuMois(){
  const memo = { mode:P.mode, anchor:P.anchor };
  P.mode = "month"; P.anchor = todayISO();
  const ce = sum(periodTx(), "out");
  const [deb, fin] = periodBounds();
  P.mode = memo.mode; P.anchor = memo.anchor;

  const jours = Math.max(1, Math.round((new Date(todayISO()+"T12:00:00") - new Date(deb+"T12:00:00")) / 86400000) + 1);
  const total = Math.round((new Date(fin+"T12:00:00") - new Date(deb+"T12:00:00")) / 86400000) + 1;
  if (ce <= 0 || jours >= total) return null;

  const projete = ce / jours * total;
  const avant = previousTotals();
  // sous 30 € de dépenses, le mois précédent n'est pas une référence utilisable
  const ref = avant && avant.out >= 30 ? avant.out : null;
  let texte = "à ce rythme, " + fmt(projete) + " sur le mois";
  let ton = "info";
  if (ref){
    const ecart = Math.round((projete - ref) / ref * 100);
    if (ecart > 150){ ton = "urgent"; texte += " — bien plus que le mois dernier (" + fmt(ref) + ")"; }
    else if (ecart > 15){ ton = "urgent"; texte += " — " + ecart + " % de plus que le mois dernier"; }
    else if (ecart < -15) texte += " — " + Math.abs(ecart) + " % de moins que le mois dernier";
    else texte += ", comme le mois dernier";
  }
  return { ton, titre: fmt(ce) + " dépensés en " + jours + " jour" + (jours > 1 ? "s" : ""), texte };
}

/* ---------- Investissement ---------- */

function sampleDates(dates, max){
  if (dates.length <= max) return dates;
  const step = Math.ceil(dates.length / max);
  const out = [];
  for (let i = 0; i < dates.length; i += step) out.push(dates[i]);
  if (out[out.length-1] !== dates[dates.length-1]) out.push(dates[dates.length-1]);
  return out;
}

function holdingSeries(id){
  const d0 = firstAnchorDate(id);
  if (!d0 || priceEUR(symOf(id), d0) == null) return [];
  const dates = sampleDates(qDates(symOf(id)).filter(d => d >= d0), 90);
  return dates.map(d => ({ y: valueAt(id, d) }));
}

/** courbe du total : démarre au premier versement connu, tous placements confondus */
function totalSeries(list){
  const tracked = list.filter(a => firstAnchorDate(a.id) && priceEUR(symOf(a.id), firstAnchorDate(a.id)) != null);
  if (!tracked.length) return [];
  const start = tracked.reduce((mn,a) => firstAnchorDate(a.id) < mn ? firstAnchorDate(a.id) : mn, "9999-12-31");
  const dates = sampleDates([...new Set(tracked.flatMap(a => qDates(symOf(a.id))))]
                              .filter(d => d >= start).sort(), 90);
  if (dates.length < 3) return [];
  return dates.map(d => ({ y: Math.round(tracked.reduce((s,a) => s + valueAt(a.id, d), 0) * 100) / 100 }));
}

const holdColor = i => PALETTE[(i * 3 + 4) % PALETTE.length];

/** phrase décrivant les intérêts courus d'un projet immobilier */
function tauxCaption(id){
  const a = acc(id) || {};
  if (!(a.rate > 0)) return "Renseigne le taux annuel pour que la valeur évolue toute seule.";
  const place = investRef(id), val = investEstimate(id).value;
  const gagne = Math.round((val - place) * 100) / 100;
  const anchors = anchorsOf(id, FAR);
  const depuis = anchors.length ? anchors.map(x => x.date).sort()[0] : null;
  if (!depuis || place <= 0) return "Intérêts comptés au prorata des jours, sans capitalisation.";
  const jours = Math.max(0, Math.round((new Date(todayISO()+"T12:00:00") - new Date(depuis+"T12:00:00")) / 86400000));
  return fmt(place) + " placés le " + shortDate(depuis) + " · " + jours + " jour" + (jours > 1 ? "s" : "")
       + " à " + String(a.rate).replace(".", ",") + " % l'an, soit " + fmt(gagne) + " d'intérêts courus.";
}

/** phrase décrivant le cours d'un symbole et sa conversion éventuelle */
function quoteCaption(sym){
  if (!sym) return "Aucun cours suivi : le montant ne bouge que si tu enregistres une nouvelle valeur.";
  const q = quote(sym);
  if (!q) return "Cours pas encore récupéré pour ce symbole.";
  let s = (q.name || sym) + " · " + (q.last != null ? q.last.toLocaleString("fr-FR") + " " + (q.currency || "") : "cours en attente");
  if (q.currency && q.currency !== "EUR"){
    const fx = fxAt(q.currency, todayISO());
    s += fx
      ? " — converti en euros au taux du jour (1 € = " + fx.toLocaleString("fr-FR") + " " + q.currency + ")"
      : " — taux de change en cours de récupération";
  }
  return s + ".";
}

function quotesAge(){
  const syms = [...new Set(S.accounts.filter(isAsset).map(a => symOf(a.id)).filter(Boolean))];
  const ups = syms.map(s => (quote(s) || {}).updated).filter(Boolean);
  if (!ups.length) return "Cours pas encore récupérés";
  const oldest = ups.sort()[0];
  return oldest === todayISO() ? "Cours à jour" : "Cours du " + shortDate(oldest);
}

const recurringOf = id => (S.recurring || []).find(r => r.to === id);
function recurringLabel(r){
  const src = r.from === "ext" ? "de l'extérieur" : "depuis " + ((acc(r.from) || {}).name || "?");
  return fmt(r.amount) + " le " + r.day + " de chaque mois, " + src;
}

/* LE GRAPHIQUE DES PLACEMENTS — celui des calculateurs d'intérêts composés :
   deux couches empilées, ce qu'on a versé et ce que ça a rapporté. On lit d'un coup
   d'œil la part du capital qui vient de soi et la part qui vient du temps. */
function placementSeries(){
  const list = S.accounts.filter(isAsset);
  if (!list.length) return [];
  const debuts = list.map(a => firstAnchorDate(a.id)).filter(Boolean).sort();
  if (!debuts.length) return [];
  // même fenêtre que la courbe du capital : le sélecteur Jour/Mois/Année pilote les deux,
  // bornée au premier versement — avant, il n'y a rien à montrer
  const f = fenetreCourbe();
  const debut = f.debut > debuts[0] ? f.debut : debuts[0];
  const fin = f.fin;
  const jours = Math.round((new Date(fin+"T12:00:00") - new Date(debut+"T12:00:00")) / 86400000);
  if (jours < 3) return [];
  const pas = Math.max(1, Math.round(jours / 70));
  const pts = [];
  for (let d = debut; d <= fin; d = shiftDays(d, pas)) pts.push(pointPlacement(list, d));
  const dernier = pointPlacement(list, fin);
  if (pts[pts.length-1].d !== fin) pts.push(dernier);
  return pts;
}
function pointPlacement(list, d){
  let verse = 0, valeur = 0;
  for (const a of list){
    const anchors = anchorsOf(a.id, d);
    verse  += anchors.reduce((s,x) => s + x.amount, 0);
    valeur += valueAt(a.id, d);
  }
  return { d, verse: Math.round(verse*100)/100, valeur: Math.round(valeur*100)/100 };
}

/** date d'occurrence suivante pour un jour du mois donné */
function nextOccurrence(cursor, day, includeCursor){
  const [y, m] = cursor.split("-").map(Number);
  const mk = (yy, mm) => {
    const last = new Date(yy, mm, 0).getDate();
    return yy + "-" + String(mm).padStart(2,"0") + "-" + String(Math.min(day, last)).padStart(2,"0");
  };
  let cand = mk(y, m);
  if (includeCursor ? cand < cursor : cand <= cursor) cand = mk(m === 12 ? y+1 : y, m === 12 ? 1 : m+1);
  return cand;
}

/** crée les versements automatiques échus depuis la dernière ouverture */
function runRecurring(){
  let added = 0;
  const today = todayISO();

  // 1. les versements planifiés à une date précise, une seule fois
  for (const r of (S.planned || [])){
    if (r.done || !acc(r.to) || r.date > today) continue;
    const t = { id:uid(), amount:r.amount, date:r.date,
                label: r.label || "Versement planifié", auto:r.id };
    if (r.from === "ext" || !acc(r.from)){
      t.type = "in"; t.to = r.to; t.adj = true;
      t.cat = catList("in").some(c => c.name === "Cadeau reçu") ? "Cadeau reçu" : catList("in")[0].name;
    } else {
      t.type = "tr"; t.from = r.from; t.to = r.to;
    }
    S.tx.push(t); r.done = true; added++;
  }

  // 2. les versements récurrents, mois après mois
  for (const r of (S.recurring || [])){
    if (!acc(r.to)) continue;
    let cursor = r.last || r.start;
    let guard = 0;
    while (guard++ < 240){
      const next = nextOccurrence(cursor, r.day, !r.last);
      if (!next || next > today) break;
      const t = { id:uid(), amount:r.amount, date:next, label:"Versement automatique", auto:r.id };
      if (r.from === "ext" || !acc(r.from)){
        t.type = "in"; t.to = r.to; t.adj = true;
        t.cat = catList("in").some(c => c.name === "Cadeau reçu") ? "Cadeau reçu" : catList("in")[0].name;
      } else {
        t.type = "tr"; t.from = r.from; t.to = r.to;
      }
      S.tx.push(t);
      r.last = next; cursor = next; added++;
    }
  }
  if (added) save();
  return added;
}

function catBars(cats, side){
  const total = cats.reduce((s,[,v]) => s + v, 0) || 1;
  return '<div class="catlist">' + cats.map(([c,v]) => {
    const col = catColor(c, side);
    return '<div class="cline">'
      + '<span class="cn"><i style="background:' + col + '"></i>' + esc(c) + '</span>'
      + '<span class="cb"><i style="width:' + (v / total * 100).toFixed(2) + '%;background:' + col + '"></i></span>'
      + '<span class="cv num">' + fmt(v) + '</span>'
      + '<span class="cp num">' + Math.round(v / total * 100) + ' %</span>'
      + '</div>';
  }).join("") + '</div>';
}

function barChart(items){
  if (!items.length) return emptyBox("Rien à afficher");
  const max = Math.max(1, ...items.flatMap(m => [m.in, m.out]));
  const every = items.length <= 14 ? 1 : Math.ceil(items.length / 12);

  // rendu en HTML plutôt qu'en SVG : les proportions et les textes ne sont jamais étirés
  return '<div class="bchart">'
    + '<div class="bgrid">'
      + [1, .5, 0].map(f => '<span style="bottom:' + (f * 100) + '%"><b>' + esc(eur0.format(max * f)) + '</b></span>').join("")
    + '</div>'
    + '<div class="bcols">'
      + items.map((m,i) =>
          '<div class="bcol" title="' + esc(m.label) + ' · ' + esc(fmt(m.in)) + ' entrés, ' + esc(fmt(m.out)) + ' dépensés">'
          + '<div class="bpair">'
            // une valeur nulle ne dessine rien : sinon la ligne de base se couvre de traits
            + (m.in  > 0 ? '<i class="bin"  style="height:' + (m.in  / max * 100).toFixed(2) + '%"></i>' : "")
            + (m.out > 0 ? '<i class="bout" style="height:' + (m.out / max * 100).toFixed(2) + '%"></i>' : "")
          + '</div>'
          + '<span class="blab">' + (i % every === 0 ? esc(m.label) : "") + '</span></div>').join("")
    + '</div></div>'
    ;
}

function sparkline(pts, color){
  if (!pts || pts.length < 2) return '<svg class="spark"></svg>';
  const W = 100, H = 34, p = 3;
  const ys = pts.map(x => x.y), min = Math.min(...ys), max = Math.max(...ys);
  const span = (max - min) || 1;
  const X = i => p + (i/(pts.length-1)) * (W - p*2);
  const Y = v => H - p - ((v - min)/span) * (H - p*2);
  const d = pts.map((x,i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(x.y).toFixed(1)).join(" ");
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'">'
    + '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/* MOTEUR DES GRAPHIQUES.
   Ils ne sont plus dessinés dans un repère fixe étiré à la largeur du bloc : cette
   déformation écrasait le trait, les cercles ET les chiffres de l'axe — c'est ce qui
   les faisait paraître « allongés ». Ici on mesure la largeur réelle en pixels et on

/** courbe simple : le patrimoine dans le temps */

/** aire empilée : ce qui a été versé, et ce que ça a rapporté par-dessus */

      + fmtS(Math.round((dernier.valeur - dernier.verse) * 100) / 100) + '</b></span>'
    + '</div>';
}

/** un axe lisible : des paliers ronds, pas des valeurs arbitraires */
function paliers(bas, haut, combien){
  const brut = (haut - bas) / combien;
  const dix = Math.pow(10, Math.floor(Math.log10(Math.max(brut, 1e-6))));
  const pas = [1, 2, 2.5, 5, 10].map(x => x * dix).find(x => x >= brut) || dix * 10;
  const out = [];
  for (let v = Math.ceil(bas / pas) * pas; v <= haut + 1e-9; v += pas) out.push(v);
  return out;
}

function dessinerCourbe(el){
  const L = Math.round(el.clientWidth), H = +el.dataset.h;
  if (!L || !H) return;
  const empile = el.dataset.type === "empile";
  const axe = empile || el.dataset.axe === "1";

  const pts = el.dataset.pts.split(",").map(x => {
    if (empile){ const [d, v, val] = x.split("|"); return { d, verse:+v, valeur:+val }; }
    const i = x.lastIndexOf(":");
    return { d: x.slice(0,i), y: +x.slice(i+1) };
  });
  if (pts.length < 2) return;

  const gG = axe ? 58 : 10, gD = 10, gH = 14, gB = axe ? 26 : 12;
  let bas, haut;
  if (empile){
    bas = 0;
    haut = Math.max(...pts.map(p => Math.max(p.valeur, p.verse))) * 1.1 || 1;
  } else {
    const ys = pts.map(p => p.y), mn = Math.min(...ys), mx = Math.max(...ys);
    // une variation de 2 % ne doit pas ressembler à une envolée
    const demi = Math.max((mx - mn) / 2, Math.max(Math.abs(mx) * 0.06, 1));
    const c0 = (mx + mn) / 2;
    bas = c0 - demi * 1.25; haut = c0 + demi * 1.25;
  }
  const span = haut - bas || 1;
  const X = i => gG + (i / (pts.length - 1)) * (L - gG - gD);
  const Y = v => gH + (1 - (v - bas) / span) * (H - gH - gB);
  el.__geo = { L, H, gG, gD, X };

  const trace = f => pts.map((p,i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(f(p)).toFixed(1)).join(" ");
  const socle = " L" + X(pts.length-1).toFixed(1) + " " + (H-gB).toFixed(1)
              + " L" + X(0).toFixed(1) + " " + (H-gB).toFixed(1) + " Z";

  let grille = "";
  if (axe){
    for (const v of paliers(bas, haut, 4)){
      const y = Y(v).toFixed(1);
      grille += '<line x1="'+gG+'" x2="'+(L-gD)+'" y1="'+y+'" y2="'+y+'" class="gl"/>'
        + '<text x="'+(gG-10)+'" y="'+(+y+3.8)+'" class="gt" text-anchor="end">'
        + esc(eur0.format(v)) + '</text>';
    }
    // quelques dates en bas, jamais plus de quatre pour ne pas encombrer
    const n = Math.min(4, pts.length);
    for (let k = 0; k < n; k++){
      const i = Math.round(k * (pts.length - 1) / (n - 1 || 1));
      grille += '<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" class="gt" text-anchor="'
        + (k === 0 ? "start" : k === n-1 ? "end" : "middle") + '">'
        + esc(shortDate(pts[i].d)) + '</text>';
    }
  }

  const uid2 = "gr" + Math.random().toString(36).slice(2,7);
  let corps;
  if (empile){
    const dessus = trace(p => p.valeur);
    const retour = pts.slice().reverse()
      .map((p,i) => "L" + X(pts.length-1-i).toFixed(1) + " " + Y(p.verse).toFixed(1)).join(" ");
    corps =
        '<path d="'+trace(p => p.verse)+socle+'" fill="url(#v'+uid2+')"/>'
      + '<path d="'+dessus+' '+retour+' Z" fill="url(#g'+uid2+')"/>'
      + '<path d="'+trace(p => p.verse)+'" fill="none" stroke="var(--asset)" stroke-width="1.5" opacity=".9"/>'
      + '<path d="'+dessus+'" fill="none" stroke="var(--pos)" stroke-width="2.5" stroke-linejoin="round"/>';
  } else {
    const monte = pts[pts.length-1].y >= pts[0].y;
    const c = monte ? "var(--pos)" : "var(--neg)";
    corps =
        '<path d="'+trace(p => p.y)+socle+'" fill="url(#g'+uid2+')"/>'
      + '<path d="'+trace(p => p.y)+'" fill="none" stroke="'+c+'" stroke-width="2.5" '
      + 'stroke-linejoin="round" stroke-linecap="round"/>'
      + '<circle class="dot" cx="'+X(pts.length-1).toFixed(1)+'" cy="'+Y(pts[pts.length-1].y).toFixed(1)
      + '" r="4" fill="'+c+'" stroke="var(--surface)" stroke-width="2.5"/>';
  }

  const cGrad = empile ? "var(--pos)" : (pts[pts.length-1].y >= pts[0].y ? "var(--pos)" : "var(--neg)");
  el.innerHTML =
    '<svg width="'+L+'" height="'+H+'" viewBox="0 0 '+L+' '+H+'" aria-hidden="true">'
      + '<defs>'
        + '<linearGradient id="g'+uid2+'" x1="0" y1="0" x2="0" y2="1">'
          + (empile
              ? '<stop offset="0%" stop-color="#5FD39A"/>'
                + '<stop offset="55%" stop-color="#3FAE74"/>'
                + '<stop offset="100%" stop-color="#2C8C5B"/>'
              : '<stop offset="0%" stop-color="'+cGrad+'" stop-opacity=".26"/>'
                + '<stop offset="100%" stop-color="'+cGrad+'" stop-opacity="0"/>')
        + '</linearGradient>'
        + '<linearGradient id="v'+uid2+'" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0%" stop-color="#63BFD6"/>'
          + '<stop offset="45%" stop-color="#3B93AF"/>'
          + '<stop offset="100%" stop-color="#1B4A6B"/>' 
        + '</linearGradient>'
      + '</defs>'
      + grille + corps
      + '<line class="cross" x1="0" x2="0" y1="'+gH+'" y2="'+(H-gB)+'" style="display:none"/>'
    + '</svg>'
    + '<div class="lc-tip" hidden></div>';
}

/* Survol : la valeur exacte à la date pointée. Un graphique sans ça n'est qu'un décor. */
function brancherCourbes(racine){
  for (const el of (racine || document).querySelectorAll(".lc")){
    dessinerCourbe(el);
    if (el.dataset.pret) continue;
    el.dataset.pret = "1";
    const empile = el.dataset.type === "empile";
    const pts = el.dataset.pts.split(",").map(x => {
      if (empile){ const [d, v, val] = x.split("|"); return { d, verse:+v, valeur:+val }; }
      const i = x.lastIndexOf(":");
      return { d: x.slice(0,i), y: +x.slice(i+1) };
    });

    el.onpointermove = e => {
      const g = el.__geo; if (!g) return;
      const r = el.getBoundingClientRect();
      const x = e.clientX - r.left;
      const i = Math.max(0, Math.min(pts.length-1,
        Math.round((x - g.gG) / (g.L - g.gG - g.gD) * (pts.length - 1))));
      const p = pts[i], px = g.X(i);
      const cross = el.querySelector(".cross"), tip = el.querySelector(".lc-tip");
      if (!cross || !tip) return;
      cross.setAttribute("x1", px); cross.setAttribute("x2", px);
      cross.style.display = "";
      tip.hidden = false;
      tip.innerHTML = empile
        ? '<b>' + esc(fmt(p.valeur)) + '</b><span>' + esc(fmt(p.verse)) + ' versés · '
          + esc(fmtS(Math.round((p.valeur - p.verse) * 100) / 100)) + '</span>'
          + '<span>' + esc(shortDate(p.d)) + '</span>'
        : '<b>' + esc(fmt(p.y)) + '</b><span>' + esc(shortDate(p.d)) + '</span>';
      tip.style.left = Math.max(46, Math.min(g.L - 46, px)) + "px";
    };
    el.onpointerleave = () => {
      const cross = el.querySelector(".cross"), tip = el.querySelector(".lc-tip");
      if (cross) cross.style.display = "none";
      if (tip) tip.hidden = true;
    };
  }
}

/* actions déclenchées depuis l'intérieur d'une fenêtre */
ov.addEventListener("click", e => {
  const am = e.target.closest("[data-addmark]");
  if (am){
    const id = am.dataset.addmark;
    const v = parseAmount(ov.querySelector("#h_val").value);
    if (!(v > 0)) return shake(ov.querySelector("#h_val"));
    S.marks.push({ id:uid(), accountId:id, date: ov.querySelector("#h_date").value || todayISO(), value:v });
    save(); render(); modalHolding(id); toast("Montant enregistré");
    return;
  }
  const sr = e.target.closest("[data-setrec]");
  if (sr){ modalRecurring(sr.dataset.setrec); return; }

  const dp = e.target.closest("[data-delplan]");
  if (dp){
    const r = (S.planned || []).find(x => x.id === dp.dataset.delplan);
    S.planned = (S.planned || []).filter(x => x.id !== dp.dataset.delplan);
    save(); render();
    if (r) modalRecurring(r.to);
    toast("Versement prévu annulé", "Annuler", () => { S.planned.push(r); save(); render(); });
    return;
  }

  const dr = e.target.closest("[data-delrec]");
  if (dr){
    const r = (S.recurring || []).find(x => x.id === dr.dataset.delrec);
    S.recurring = (S.recurring || []).filter(x => x.id !== dr.dataset.delrec);
    save(); render();
    if (r) modalHolding(r.to);
    toast("Versement automatique supprimé");
    return;
  }
  const dh = e.target.closest("[data-delhold]");
  if (dh){
    const id = dh.dataset.delhold, a = acc(id);
    if (!a) return;
    const snap = { acc:{...a},
                   tx: S.tx.filter(t => t.from === id || t.to === id),
                   marks: S.marks.filter(m => m.accountId === id),
                   rec: (S.recurring || []).filter(r => r.to === id) };
    S.accounts  = S.accounts.filter(x => x.id !== id);
    S.tx        = S.tx.filter(t => t.from !== id && t.to !== id);
    S.marks     = S.marks.filter(m => m.accountId !== id);
    S.recurring = (S.recurring || []).filter(r => r.to !== id);
    save(); closeModal(); render();
    toast("Placement supprimé", "Annuler", () => {
      S.accounts.push(snap.acc); S.tx.push(...snap.tx);
      S.marks.push(...snap.marks); S.recurring.push(...snap.rec);
      save(); render();
    });
    return;
  }
  const dm = e.target.closest("[data-delmark]");
  if (dm){
    const m = S.marks.find(x => x.id === dm.dataset.delmark);
    S.marks = S.marks.filter(x => x.id !== dm.dataset.delmark);
    save(); render();
    if (m) modalHolding(m.accountId);
    return;
  }
});

function parseAmount(v){
  const n = parseFloat(String(v).replace(/\s/g,"").replace(",","."));
  return isFinite(n) ? Math.round(Math.abs(n) * 100) / 100 : 0;
}
function parseAmountSigned(v){
  const n = parseFloat(String(v).replace(/\s/g,"").replace(",","."));
  return isFinite(n) ? Math.round(n * 100) / 100 : 0;
}
function shake(el){
  if (!el) return;
