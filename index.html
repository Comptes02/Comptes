/* --- ajouter / modifier une opération --- */
function modalTx(existing){
  const t0 = existing ? S.tx.find(x => x.id === existing) : null;
  let type = t0 ? t0.type : "out";

  openModal(
    '<h3>'+(t0 ? "Modifier l\'opération" : "Nouvelle opération")+'</h3>'
    + '<div class="seg" id="seg"><button data-t="out">Dépense</button><button data-t="in">Entrée</button><button data-t="tr">Virement</button></div>'
    + '<div class="f"><label>Montant</label><input id="m_amt" class="amt-in num" type="text" inputmode="decimal" placeholder="0,00" value="'+(t0 ? String(t0.amount).replace(".",",") : "")+'"></div>'
    + '<div class="f" id="f_label"><label>C\'était quoi ?</label><input id="m_label" type="text" placeholder="Ex : kebab, forfait, jeu…" value="'+esc(t0 ? t0.label : "")+'"></div>'
    + '<div id="f_accs"></div>'
    + '<div class="f2"><div class="f" id="f_cat"></div>'
    + '<div class="f"><label>Date</label><input id="m_date" type="date" value="'+(t0 ? t0.date : todayISO())+'"></div></div>'
    + '<div class="acts">'
      + (t0 ? '<button class="btn btn-danger" data-del-tx>Supprimer</button>' : "")
      + '<button class="btn" data-cancel>Annuler</button>'
      + '<button class="btn btn-p" data-ok>'+(t0 ? "Enregistrer" : "Ajouter")+'</button></div>'
  );

  const segEl = ov.querySelector("#seg");
  segEl.onclick = e => { const b = e.target.closest("[data-t]"); if (b){ type = b.dataset.t; sync(); } };
  sync();

  function sync(){
    segEl.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === type));
    const curAcc = t0 ? (t0.type === "in" ? t0.to : t0.from) : null;
    ov.querySelector("#f_accs").innerHTML = type === "tr"
      ? '<div class="f2"><div class="f"><label>Depuis</label><select id="m_from">'+accOptions(t0 && t0.from)+'</select></div>'
        + '<div class="f"><label>Vers</label><select id="m_to">'+accOptions(t0 && t0.to)+'</select></div></div>'
      : '<div class="f"><label>'+(type === "in" ? "Sur quel compte ?" : "Payé avec")+'</label><select id="m_acc">'+accOptions(curAcc)+'</select></div>';
    ov.querySelector("#f_cat").innerHTML = type === "tr" ? ""
      : '<label>Catégorie</label><select id="m_cat">'+catOptions(type, t0 && t0.cat)+'</select>';
    ov.querySelector("#f_label label").textContent = type === "tr" ? "Note (facultatif)" : "C'était quoi ?";
    if (type === "tr" && !t0){
      const to = ov.querySelector("#m_to");
      if (to && S.accounts.length > 1) to.selectedIndex = 1;
    }
  }

  ov.querySelector("[data-cancel]").onclick = closeModal;
  const dl = ov.querySelector("[data-del-tx]");
  if (dl) dl.onclick = () => {
    const copy = { ...t0 };
    S.tx = S.tx.filter(x => x.id !== t0.id);
    save(); closeModal(); render();
    toast("Opération supprimée", "Annuler", () => { S.tx.push(copy); save(); render(); });
  };

  ov.querySelector("[data-ok]").onclick = () => {
    const amt = parseAmount(ov.querySelector("#m_amt").value);
    if (!(amt > 0)) return shake(ov.querySelector("#m_amt"));
    const t = { id: t0 ? t0.id : uid(), type, amount: amt,
                label: ov.querySelector("#m_label").value.trim(),
                date: ov.querySelector("#m_date").value || todayISO() };
    if (t0 && t0.adj) t.adj = true;
    if (t0 && t0.src) t.src = t0.src;
    if (type === "tr"){
      t.from = ov.querySelector("#m_from").value;
      t.to   = ov.querySelector("#m_to").value;
      if (t.from === t.to) return shake(ov.querySelector("#m_to"));
    } else {
      const a = ov.querySelector("#m_acc").value;
      if (type === "in") t.to = a; else t.from = a;
      t.cat = ov.querySelector("#m_cat").value;
    }
    if (t0){
      S.tx[S.tx.findIndex(x => x.id === t0.id)] = t;
      save(); closeModal(); render(); toast("Opération modifiée");
    } else {
      S.tx.push(t); save(); closeModal(); render();
      toast("Opération ajoutée", "Annuler", () => { S.tx = S.tx.filter(x => x.id !== t.id); save(); render(); });
    }
  };
}

/* --- gestion des catégories --- */
let catSide = "out";

function modalCats(){
  openModal('<h3>Mes catégories</h3><div id="cbody"></div>', true);
  drawCats();
}

function drawCats(){
  const used = name => S.tx.filter(t => t.type === catSide && t.cat === name).length;
  const l = catList(catSide);
  ov.querySelector("#cbody").innerHTML =
    '<div class="seg">'
      + '<button data-cs="out"'+(catSide==="out"?' class="on"':"")+'>Dépenses</button>'
      + '<button data-cs="in"'+(catSide==="in"?' class="on"':"")+'>Entrées</button>'
    + '</div>'
    + l.map(c =>
        '<div class="catrow" data-cid="'+c.id+'">'
        + '<i class="sw" style="background:'+c.color+'"></i>'
        + '<input type="text" value="'+esc(c.name)+'" data-cname>'
        + '<span class="n">'+used(c.name)+' op.</span>'
        + '<button data-cdel title="Supprimer">'+svg('<path d="M18 6L6 18M6 6l12 12"/>',2.2)+'</button></div>'
      ).join("")
    + '<div class="catrow"><i class="sw" style="background:var(--line)"></i>'
      + '<input type="text" id="cnew" placeholder="Ajouter une catégorie…"><span class="n"></span>'
      + '<button data-cadd title="Ajouter">'+svg('<path d="M12 5v14M5 12h14"/>',2.2)+'</button></div>'
    + '<div class="hint" style="margin-top:12px">Renommer une catégorie met à jour toutes les opérations qui l\'utilisent. '
      + 'La supprimer te demandera vers quelle autre catégorie déplacer ses opérations.</div>'
    + '<div class="acts"><button class="btn btn-p" data-cclose>Terminé</button></div>';

  const body = ov.querySelector("#cbody");
  body.onclick = e => {
    const side = e.target.closest("[data-cs]");
    if (side){ catSide = side.dataset.cs; drawCats(); return; }
    if (e.target.closest("[data-cclose]")){ closeModal(); render(); return; }
    if (e.target.closest("[data-cadd]")){ addCat(); return; }
    const del = e.target.closest("[data-cdel]");
    if (del){ deleteCat(del.closest("[data-cid]").dataset.cid); return; }
  };
  body.onkeydown = e => {
    if (e.key === "Enter" && e.target.id === "cnew"){ e.preventDefault(); addCat(); }
    if (e.key === "Enter" && e.target.hasAttribute("data-cname")){ e.preventDefault(); e.target.blur(); }
  };
  body.querySelectorAll("[data-cname]").forEach(inp => {
    inp.onblur = () => renameCat(inp.closest("[data-cid]").dataset.cid, inp);
  });
}

function renameCat(id, inp){
  const c = catList(catSide).find(c => c.id === id);
  if (!c) return;
  const nv = inp.value.trim();
  if (!nv || nv === c.name){ inp.value = c.name; return; }
  if (catList(catSide).some(x => x.id !== id && x.name.toLowerCase() === nv.toLowerCase())){
    toast("Cette catégorie existe déjà"); inp.value = c.name; return;
  }
  const old = c.name;
  c.name = nv;
  const n = S.tx.filter(t => t.type === catSide && t.cat === old).length;
  S.tx.forEach(t => { if (t.type === catSide && t.cat === old) t.cat = nv; });
  save(); drawCats();
  toast(n ? "Renommée · " + n + " opération" + (n>1?"s mises":" mise") + " à jour" : "Catégorie renommée");
}

function addCat(){
  const inp = ov.querySelector("#cnew");
  const nv = inp.value.trim();
  if (!nv) return;
  if (catList(catSide).some(c => c.name.toLowerCase() === nv.toLowerCase())) return toast("Cette catégorie existe déjà");
  catList(catSide).push(mkCat(nv, catList(catSide).length, catSide));
  save(); drawCats(); toast("Catégorie ajoutée");
}

function deleteCat(id){
  const l = catList(catSide);
  const c = l.find(x => x.id === id);
  if (!c) return;
  if (l.length < 2) return toast("Il faut garder au moins une catégorie");
  const n = S.tx.filter(t => t.type === catSide && t.cat === c.name).length;
  const others = l.filter(x => x.id !== id);
  if (!n){
    S.cats[catSide] = others; save(); drawCats(); toast("Catégorie supprimée");
    return;
  }
  openModal(
    '<h3>Supprimer « '+esc(c.name)+' »</h3>'
    + '<div class="hint" style="margin-bottom:14px">'+n+' opération'+(n>1?"s utilisent":" utilise")+' cette catégorie. Où '+(n>1?"les":"la")+' déplacer ?</div>'
    + '<div class="f"><label>Nouvelle catégorie</label><select id="cmove">'
      + others.map(o => '<option value="'+esc(o.name)+'">'+esc(o.name)+'</option>').join("") + '</select></div>'
    + '<div class="acts"><button class="btn" data-cancel>Annuler</button><button class="btn btn-p" data-ok>Déplacer et supprimer</button></div>'
  );
  ov.querySelector("[data-cancel]").onclick = () => modalCats();
  ov.querySelector("[data-ok]").onclick = () => {
    const target = ov.querySelector("#cmove").value;
    S.tx.forEach(t => { if (t.type === catSide && t.cat === c.name) t.cat = target; });
    S.cats[catSide] = others;
    save(); modalCats();
    toast(n + " opération" + (n>1?"s déplacées":" déplacée") + " vers « " + target + " »");
  };
}

  );
  // le libellé suit le type choisi : « Banque » pour un compte, « Plateforme » pour un placement
  // La valeur d'un placement se calcule (cours ou taux) : la saisir à la main ici
  // écraserait sa date de départ et remettrait le suivi à zéro. On la retire.
  const majSolde = k => {
    const asset = ASSET_KINDS.includes(k);
    ov.querySelector("#a_balwrap").hidden = asset;
    ov.querySelector("#a_balhint").textContent = asset
      ? "La valeur d'un placement se calcule toute seule. Pour la corriger, ouvre-le depuis l'onglet Placements."
      : (a ? "Si tu corriges le solde, l'écart est enregistré comme un ajustement (il ne compte pas comme une dépense)."

  };
  majSolde(a ? a.kind : "courant");
  ov.querySelector("#a_kind").onchange = e => {

  if (delBtn) delBtn.onclick = () => {
    const snap = { acc:{...a}, tx:S.tx.filter(t => t.from === a.id || t.to === a.id), marks:S.marks.filter(m => m.accountId === a.id) };
    S.accounts = S.accounts.filter(x => x.id !== a.id);
    S.tx = S.tx.filter(t => t.from !== a.id && t.to !== a.id);
    S.marks = S.marks.filter(m => m.accountId !== a.id);

    const bal = parseAmountSigned(ov.querySelector("#a_bal").value);
    if (!a){
      S.accounts.push({ id:uid(), name, kind:k, start:bal, bank });
    } else {
      a.name = name; a.kind = k; a.bank = bank;
      const diff = isAsset(a) ? 0 : Math.round((bal - value(a.id)) * 100) / 100;
      const used = S.tx.some(t => t.from === a.id || t.to === a.id) || S.marks.some(m => m.accountId === a.id);
      if (diff !== 0){
        if (!used){
          a.start = Math.round(((a.start || 0) + diff) * 100) / 100;
        } else {
          S.tx.push({ id:uid(), type: diff > 0 ? "in" : "out", amount:Math.abs(diff),

                      [diff > 0 ? "to" : "from"]: a.id });
        }
      }
    }
    save(); closeModal(); render();
  };
}

/** demande un cours : côté Swift dans l'app, sinon fetch direct (bloqué par CORS en navigateur) */
function refreshQuotes(sym, silent){
  const payload = JSON.stringify({ symbol: sym, url: quoteURL(sym) });
  try{ window.webkit.messageHandlers.quotes.postMessage(payload); return; }catch(e){}
  fetch(quoteURL(sym)).then(r => r.text()).then(txt => window.__quotes(sym, txt))
    .catch(() => { if (!silent) toast("Cours indisponible — vérifie ta connexion"); });

/** tous les cours suivis qui ne datent pas d'aujourd'hui, taux de change compris */
function refreshStaleQuotes(){
  const syms = new Set(S.accounts.filter(isAsset).map(a => symOf(a.id)).filter(Boolean));
  // un placement coté hors zone euro a besoin du taux du jour pour être converti
  [...syms].forEach(s => {
    const cur = (quote(s) || {}).currency;
    if (cur && cur !== "EUR") syms.add(fxSymbol(cur));
  });
  [...syms].filter(s => !quote(s) || quote(s).updated !== todayISO())
           .forEach(s => refreshQuotes(s, true));

/** appelé par l'app native (ou par le fetch de secours) avec la réponse brute de Yahoo */
window.__quotes = function(sym, raw){
  try{
    const j = typeof raw === "string" ? JSON.parse(raw) : raw;
    if (j.chart && j.chart.error) throw new Error(j.chart.error.code || "symbole inconnu");
    const r = j.chart.result[0];
    const ts = r.timestamp || [];
    const closes = (r.indicators.quote[0] || {}).close || [];
    const series = {};
    for (let i = 0; i < ts.length; i++){
      const c = closes[i];
      if (c == null) continue;
      series[new Date(ts[i] * 1000).toLocaleDateString("sv-SE")] = Math.round(c * 10000) / 10000;
    }
    if (!Object.keys(series).length) throw new Error("aucune donnee");
    const last = r.meta.regularMarketPrice != null ? r.meta.regularMarketPrice : closes.filter(c => c != null).pop();
    S.quotes[sym] = {
      updated: todayISO(),
      last: Math.round(last * 10000) / 10000,
      currency: r.meta.currency || "",
      name: r.meta.shortName || r.meta.symbol || sym,
      series
    };
    save();
    // cours en devise étrangère : on enchaîne sur le taux de change du jour
    const cur = S.quotes[sym].currency;
    if (cur && cur !== "EUR"){
      const fx = fxSymbol(cur);
      if (!quote(fx) || quote(fx).updated !== todayISO()) refreshQuotes(fx, true);
    }
    if (tab === "invest" || tab === "home") render();
  }catch(e){
    if (!S.quotes[sym]) toast("Symbole « " + sym + " » introuvable chez Yahoo");
  }
};

/* ============================ import CSV ============================ */
function parseCSV(text, delim){
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"'){ q = true; }
    else if (c === delim){ row.push(cell); cell = ""; }
    else if (c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r"){ cell += c; }
  }
  if (cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function detectDelim(text){
  const head = text.split("\n").slice(0, 12).join("\n");
  let best = ";", bestScore = 0;
  for (const d of [";", ",", "\t", "|"]){
    const rows = parseCSV(head, d);
    if (rows.length < 2) continue;
    const counts = {};
    rows.forEach(r => { counts[r.length] = (counts[r.length] || 0) + 1; });
    const mode = +Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0];
    if (mode < 2) continue;
    const score = mode * counts[mode] / rows.length;
    if (score > bestScore){ bestScore = score; best = d; }
  }
  return best;
}
function parseCsvDate(s){
  s = String(s || "").trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m){
    let y = +m[3]; if (y < 100) y += 2000;
    return y + "-" + String(+m[2]).padStart(2,"0") + "-" + String(+m[1]).padStart(2,"0");
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + "-" + String(+m[2]).padStart(2,"0") + "-" + String(+m[3]).padStart(2,"0");
  return null;
}
function parseCsvNum(s){
  if (s == null) return null;
  let v = String(s).replace(/[\s  €]/gi, "").replace(/EUR/gi, "").replace(/−/g, "-");
  if (!v) return null;
  let neg = false;
  if (/^\(.*\)$/.test(v)){ neg = true; v = v.slice(1,-1); }
  if (/-$/.test(v)){ neg = true; v = v.slice(0,-1); }
  if (/,\d{1,2}$/.test(v)) v = v.replace(/\./g,"").replace(",",".");
  else v = v.replace(/,/g,"");
  if (!/^-?\d*\.?\d+$/.test(v)) return null;
  const n = parseFloat(v);
  if (!isFinite(n)) return null;
  return neg ? -Math.abs(n) : n;
}

/** la règle ne s'applique que si la catégorie existe encore chez l'utilisateur */
function guessCat(label, isIn){
  const names = catList(isIn ? "in" : "out").map(c => c.name);
  for (const [re, c] of (isIn ? CAT_RULES_IN : CAT_RULES)){
    if (re.test(label) && names.includes(c)) return c;
  }
  return names.includes("Autre") ? "Autre" : names[names.length-1];
}

const dupKey = (date, amount, label) =>
  date + "|" + Math.round(Math.abs(amount) * 100) + "|" + String(label).toLowerCase().replace(/\s+/g," ").trim().slice(0,22);

function openCsvPicker(accountId){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".csv,.txt,text/csv,text/plain";
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    readTextSmart(file, text => {
      const rows = parseCSV(text, detectDelim(text));
      if (rows.length < 2) return toast("Ce fichier ne ressemble pas à un relevé CSV");
      modalCsv(rows, file.name, accountId);
    });
  };

function readTextSmart(file, cb){
  const r = new FileReader();
  r.onload = () => {
    const txt = String(r.result || "");
    if (txt.indexOf("�") === -1) return cb(txt);
    const r2 = new FileReader();
    r2.onload = () => cb(String(r2.result || ""));
    r2.readAsText(file, "ISO-8859-1");
  };
  r.readAsText(file, "UTF-8");
}

function modalCsv(rows, filename, presetAccount){
  const first = rows[0];
  const hasData = first.some(c => parseCsvDate(c)) && first.some(c => parseCsvNum(c) !== null);
  const header = hasData ? first.map((_,i) => "Colonne " + (i+1)) : first.map((c,i) => c.trim() || ("Colonne " + (i+1)));
  const data = hasData ? rows : rows.slice(1);
  const nCol = Math.max(...rows.map(r => r.length));

  const score = fn => header.map((_,i) => data.reduce((s,r) => s + (fn(r[i]) ? 1 : 0), 0) / Math.max(data.length,1));
  const dateScores = score(v => parseCsvDate(v));
  const numScores  = score(v => parseCsvNum(v) !== null && String(v).trim() !== "");
  const textLen    = header.map((_,i) => data.reduce((s,r) => s + String(r[i]||"").trim().length, 0) / Math.max(data.length,1));

  let iDate = dateScores.indexOf(Math.max(...dateScores));
  if (dateScores[iDate] < 0.5) iDate = -1;
  const numCols = numScores.map((s,i) => ({ i, s })).filter(o => o.s > 0.5 && o.i !== iDate);
  const iDeb = header.findIndex(h => /d[ée]bit|retrait|sortie/i.test(h));
  const iCre = header.findIndex(h => /cr[ée]dit|versement|entr[ée]e/i.test(h));
  let iAmt, iAmt2 = -1;
  if (iDeb >= 0 && iCre >= 0){ iAmt = iDeb; iAmt2 = iCre; }
  else {
    const named = header.findIndex(h => /montant|amount|somme/i.test(h));
    iAmt = named >= 0 ? named : (numCols.length ? numCols[numCols.length-1].i : -1);
  }
  let iLab = header.findIndex(h => /libell|description|nature|intitul|motif|d[ée]tail/i.test(h));
  if (iLab < 0){
    let best = -1, bestLen = 2;
    textLen.forEach((l,i) => { if (i !== iDate && i !== iAmt && i !== iAmt2 && l > bestLen){ bestLen = l; best = i; } });
    iLab = best;
  }

  const colOpts = (sel, none) =>
    (none ? '<option value="-1"'+(sel === -1 ? " selected" : "")+'>— aucune —</option>' : "")
    + header.map((h,i) => '<option value="'+i+'"'+(i === sel ? " selected" : "")+'>'+esc(h.slice(0,40))+'</option>').join("");

  const target = presetAccount && acc(presetAccount) ? presetAccount : null;

  openModal(
    '<h3>Importer un relevé</h3>'
    + '<div class="hint" style="margin-bottom:14px">'+esc(filename)+' · '+data.length+' ligne'+(data.length>1?"s":"")+' · '+nCol+' colonnes</div>'
    + '<div class="f"><label>Sur quel compte ?</label><select id="v_acc">'+accOptions(target, a => !isAsset(a))+'</select></div>'
    + '<div class="f2">'
      + '<div class="f"><label>Colonne date</label><select id="v_date">'+colOpts(iDate)+'</select></div>'
      + '<div class="f"><label>Colonne libellé</label><select id="v_lab">'+colOpts(iLab)+'</select></div></div>'
    + '<div class="f2">'
      + '<div class="f"><label>Colonne montant'+(iAmt2 >= 0 ? " (débit)" : "")+'</label><select id="v_amt">'+colOpts(iAmt)+'</select></div>'
      + '<div class="f"><label>Colonne crédit</label><select id="v_amt2">'+colOpts(iAmt2, true)+'</select></div></div>'
    + '<div class="hint" style="margin-bottom:6px">Si ta banque sépare les entrées et les sorties en deux colonnes, renseigne les deux. Sinon laisse « aucune ».</div>'
    + '<div id="v_prev"></div>'
    + '<div class="acts"><button class="btn" data-cancel>Annuler</button><button class="btn btn-p" data-ok>Importer</button></div>',
    true
  );

  const $ = s => ov.querySelector(s);
  ["#v_date","#v_lab","#v_amt","#v_amt2"].forEach(s => { $(s).onchange = refresh; });
  ov.querySelector("[data-cancel]").onclick = closeModal;
  let ready = [];

  function build(){
    const d = +$("#v_date").value, l = +$("#v_lab").value, a = +$("#v_amt").value, a2 = +$("#v_amt2").value;
    const existing = new Set(S.tx.map(t => dupKey(t.date, t.amount, t.label || "")));
    const seen = new Set();
    const out = [];
    for (const r of data){
      const date = d >= 0 ? parseCsvDate(r[d]) : null;
      const label = (l >= 0 ? String(r[l] || "") : "").replace(/\s+/g," ").trim();
      let amount;
      if (a2 >= 0){
        const deb = parseCsvNum(r[a]), cre = parseCsvNum(r[a2]);
        amount = (cre || 0) - Math.abs(deb || 0);
      } else amount = parseCsvNum(r[a]);
      if (!date || amount === null || amount === 0){ out.push({ bad:true }); continue; }
      const key = dupKey(date, amount, label);
      const dup = existing.has(key) || seen.has(key);
      seen.add(key);
      out.push({ date, label, amount, dup });
    }
    return out;
  }
  function refresh(){
    const all = build();
    ready = all.filter(r => !r.bad && !r.dup);
    const bad = all.filter(r => r.bad).length;
    const dup = all.filter(r => r.dup).length;
    const preview = all.filter(r => !r.bad).slice(0,5);
    $("#v_prev").innerHTML =
      '<div class="prev"><table><thead><tr><th>Date</th><th>Libellé</th><th style="text-align:right">Montant</th></tr></thead><tbody>'
      + (preview.length ? preview.map(r =>
          '<tr'+(r.dup ? ' class="bad"' : "")+'><td>'+esc(r.date)+'</td><td>'+esc(r.label || "—")+(r.dup ? " (déjà présente)" : "")+'</td>'
          + '<td class="r" style="color:'+(r.amount < 0 ? "var(--neg)" : "var(--pos)")+'">'+fmtS(r.amount)+'</td></tr>').join("")
        : '<tr><td colspan="3" style="color:var(--tx3)">Aucune ligne exploitable — vérifie les colonnes choisies</td></tr>')
      + '</tbody></table></div>'
      + '<div class="hint" style="margin-top:8px">' + ready.length + ' à importer'
        + (dup ? ' · ' + dup + ' déjà présente' + (dup>1?"s":"") + ' (ignorée' + (dup>1?"s":"") + ')' : "")
        + (bad ? ' · ' + bad + ' ligne' + (bad>1?"s":"") + ' illisible' + (bad>1?"s":"") : "") + '</div>';
    const ok = ov.querySelector("[data-ok]");
    ok.textContent = ready.length ? "Importer " + ready.length + " opération" + (ready.length>1?"s":"") : "Importer";
    ok.disabled = !ready.length;
  }
  ov.querySelector("[data-ok]").onclick = () => {
    if (!ready.length) return;
    const accId = $("#v_acc").value;
    const added = [];
    for (const r of ready){
      const isIn = r.amount > 0;
      const t = { id:uid(), type: isIn ? "in" : "out", amount: Math.round(Math.abs(r.amount)*100)/100,
                  label: r.label || "Opération", date: r.date, cat: guessCat(r.label, isIn), src:"csv" };
      t[isIn ? "to" : "from"] = accId;
      S.tx.push(t); added.push(t.id);
    }
    save(); closeModal();
    P.mode = "month"; P.anchor = todayISO(); render();
    toast(added.length + " opération" + (added.length>1?"s":"") + " importée" + (added.length>1?"s":"") + " sur " + (acc(accId)||{name:""}).name, "Annuler", () => {
      S.tx = S.tx.filter(t => !added.includes(t.id)); save(); render();
    });
  };
  refresh();
}

/* ============================ synchronisation Google Drive ============================ */
/* Les données sont rangées dans un dossier privé de TON Drive, invisible depuis drive.google.com
   et lisible seulement par cette app. Google ne peut pas y voir autre chose. */

const GOOGLE_CLIENT_ID = "218922181296-pd2td8rqn628va83dgdas3apkn0mk0bs.apps.googleusercontent.com";
const DRIVE_FILE  = "comptes.json";
/* À incrémenter dès qu'un champ nouveau apparaît dans les données. Un appareil dont
   l'app est plus ancienne refusera d'écraser des données d'un schéma supérieur. */
const SCHEMA = 5;
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";

let syncStatus = "";
function setSyncStatus(s){
  syncStatus = s;
  const el = document.getElementById("syncState");
  if (el) el.textContent = s;
}

const Sync = {
  token:null, tokenExp:0, client:null, fileId:null, busy:false, pending:[],

  /** Google refuse les pages ouvertes en fichier local : il faut http(s) */
  available(){ return location.protocol === "http:" || location.protocol === "https:"; },
  on(){ return !!(S.sync && S.sync.enabled) && this.available(); },

  /** la bibliothèque Google est-elle chargée ? */
  gisReady(){ return !!(window.google && google.accounts && google.accounts.oauth2); },

  /** (re)charge la bibliothèque Google si le premier chargement a échoué */
  loadGIS(){
    if (this.gisReady() || this.loading) return;
    this.loading = true;
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload  = () => { this.loading = false; setSyncStatus("Google chargé, réessaie"); if (!ov.hidden) drawSyncModal(); };
    s.onerror = () => { this.loading = false; setSyncStatus("Google injoignable — vérifie ta connexion"); if (!ov.hidden) drawSyncModal(); };
    document.head.appendChild(s);
    setSyncStatus("Chargement de Google…");
  },

  ensureClient(){
    if (this.client) return this.client;
    if (!this.gisReady()) return null;
    try{
    this.client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: resp => {
        const waiting = this.pending; this.pending = [];
        if (resp && resp.access_token){
          this.token = resp.access_token;
          this.tokenExp = Date.now() + ((resp.expires_in || 3600) * 1000) - 60000;
          waiting.forEach(f => f());
        } else {
          const why = resp && resp.error ? resp.error : "refusée";
          setSyncStatus("Connexion Google " + why);
          if (!ov.hidden) drawSyncModal();
        }
      }
    });
    }catch(e){
      setSyncStatus("Identifiant Google refusé : " + e.message);
      return null;
    }
    return this.client;
  },

  withToken(fn, interactive){
    if (this.token && Date.now() < this.tokenExp) return fn();
    const c = this.ensureClient();
    if (!c){
      // bibliothèque absente : on retente de la charger, l'utilisateur reclique ensuite
      this.loadGIS();
      if (!ov.hidden) drawSyncModal();
      return;
    }
    this.pending.push(fn);
    try{
      c.requestAccessToken({ prompt: interactive ? "consent" : "" });
    }catch(e){
      this.pending = [];
      setSyncStatus("Impossible d'ouvrir Google : " + e.message);
      if (!ov.hidden) drawSyncModal();
    }
  },

  async api(url, opts){
    const o = opts || {};
    const r = await fetch(url, { ...o, headers: { ...(o.headers || {}), Authorization: "Bearer " + this.token } });
    if (r.status === 401){ this.token = null; throw new Error("session expirée"); }
    if (!r.ok) throw new Error("Drive " + r.status);
    return r;
  },

  async findFile(){
    if (this.fileId) return this.fileId;
    const q = encodeURIComponent("name='" + DRIVE_FILE + "'");
    const r = await this.api("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q=" + q);
    const j = await r.json();
    this.fileId = (j.files && j.files[0]) ? j.files[0].id : null;
    return this.fileId;
  },

  async doPull(){
    const id = await this.findFile();
    if (!id) return null;
    const r = await this.api("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media");
    return await r.json();
  },

  async doPush(){
    const body = JSON.stringify(S);
    const id = await this.findFile();
    if (id){
      await this.api("https://www.googleapis.com/upload/drive/v3/files/" + id + "?uploadType=media",
        { method:"PATCH", headers:{ "Content-Type":"application/json" }, body });
      return;
    }
    const meta = { name: DRIVE_FILE, parents: ["appDataFolder"] };
    const b = "comptes" + Date.now();
    const multipart =
      "--" + b + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) +
      "\r\n--" + b + "\r\nContent-Type: application/json\r\n\r\n" + body +
      "\r\n--" + b + "--";
    const r = await this.api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
      { method:"POST", headers:{ "Content-Type":"multipart/related; boundary=" + b }, body: multipart });
    this.fileId = (await r.json()).id;
  },

  /* Fusion par identifiant. « Garder le plus récent » perdait des données : il suffisait
     que l'horloge du téléphone avance un peu, ou qu'une migration y remette updatedAt à
     maintenant, pour que le téléphone réécrive tout par-dessus le Mac. C'est comme ça
     que ses projets immobiliers disparaissaient. Ici on ne jette plus rien : chaque
     liste est réunie par identifiant, et en cas de conflit sur un même identifiant on
     garde la version du côté modifié le plus récemment. */
  fusionner(local, distant){
    const recentDistant = (distant.updatedAt || "") > (local.updatedAt || "");
    const union = (a, b) => {
      const m = new Map();
      for (const x of (recentDistant ? a : b) || []) if (x && x.id) m.set(x.id, x);
      for (const x of (recentDistant ? b : a) || []) if (x && x.id) m.set(x.id, x);
      return [...m.values()];
    };
    const base = recentDistant ? { ...local, ...distant } : { ...distant, ...local };
    base.accounts  = union(local.accounts,  distant.accounts);
    base.tx        = union(local.tx,        distant.tx);
    base.marks     = union(local.marks,     distant.marks);
    base.recurring = union(local.recurring, distant.recurring);
    base.rev       = Math.max(local.rev || 0, distant.rev || 0) + 1;
    base.updatedAt = new Date().toISOString();
    base.schema    = Math.max(local.schema || 0, distant.schema || 0);
    return base;
  },

  /** rapproche les deux côtés sans jamais perdre ce qui n'existe que d'un seul */
  run(interactive){
    if (!this.available()){
      setSyncStatus("Indisponible ici : la page doit être servie par l'app ou par le site");
      if (interactive) toast("Synchro impossible depuis un fichier local");
      return;
    }
    this.withToken(async () => {
      if (this.busy) return;
      this.busy = true;
      setSyncStatus("Synchronisation…");
      try{
        const remote = await this.doPull();
        if (remote && remote.accounts){
          // une app plus ancienne ne doit jamais réécrire des données plus récentes
          if ((remote.schema || 0) > SCHEMA){
            setSyncStatus("Cet appareil a une version plus ancienne de l'app — rien n'a été touché");
            if (interactive) toast("Mets à jour l'app sur cet appareil avant de synchroniser");
            this.busy = false; return;
          }
          const base   = (S.sync && S.sync.baseRev) || 0;
          const lRev   = S.rev || 0, rRev = remote.rev || 0;
          const memeId = a => a && a.id;

          if (rRev === base && lRev > base){
            // seul cet appareil a bougé : envoi simple
            await this.doPush();
            setSyncStatus("À jour · envoyé vers Drive");
          } else if (lRev === base && rRev > base){
            // seul l'autre appareil a bougé : récupération simple
            S = remote; migrateState();
            setSyncStatus("À jour · récupéré depuis Drive");
            render();
          } else if (lRev === rRev && (S.updatedAt || "") === (remote.updatedAt || "")){
            setSyncStatus("À jour");
          } else {
            // les deux ont changé depuis le dernier accord : on réunit, on ne jette rien
            const avant = S.accounts.length;
            S = this.fusionner(S, remote);
            migrateState();
            await this.doPush();
            const gagnes = S.accounts.length - avant;
            setSyncStatus("À jour · fusionné" + (gagnes > 0 ? " (" + gagnes + " retrouvé" + (gagnes > 1 ? "s" : "") + ")" : ""));
            render();
          }
          S.sync = S.sync || {};
          S.sync.enabled = true;
          S.sync.last = new Date().toISOString();
          S.sync.baseRev = S.rev || 0;
          Store.save(S);                       // sans compter comme une modification
        } else {
          await this.doPush();
          S.sync = S.sync || {};
          S.sync.enabled = true; S.sync.last = new Date().toISOString();
          S.sync.baseRev = S.rev || 0;
          Store.save(S);
          setSyncStatus("À jour · première sauvegarde envoyée");
        }
      }catch(e){
        setSyncStatus("Échec : " + e.message);
        if (interactive) toast("Synchro impossible — " + e.message);
      }
      this.busy = false;
      if (!ov.hidden && ov.querySelector("#syncState")) drawSyncModal();
    }, interactive);
  },

  /** envoi silencieux après une modification */
  push(){
    if (!this.on()) return;
    this.withToken(async () => {
      try{
        await this.doPush();
        S.sync.last = new Date().toISOString();
        S.sync.baseRev = S.rev || 0;
        Store.save(S);
        setSyncStatus("À jour · envoyé vers Drive");
      }catch(e){ setSyncStatus("Envoi en attente : " + e.message); }
    });
  },

  disconnect(){
    S.sync = { enabled:false, last:null };
    this.token = null; this.fileId = null;
    Store.save(S);
    setSyncStatus("Déconnecté de ce Mac");
  }
};

function modalSync(){
  openModal('<h3>Synchronisation</h3><div id="syncBody"></div>');
  drawSyncModal();
}
function drawSyncModal(){
  const box = ov.querySelector("#syncBody");
  if (!box) return;
  const last = S.sync && S.sync.last
    ? new Date(S.sync.last).toLocaleString("fr-FR", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" })
    : null;
  box.innerHTML =
    '<div class="asst-out" style="margin-top:0">'
      + '<div class="k">État</div>'
      + '<div class="v" id="syncState">' + esc(syncStatus || (Sync.on() ? "Connecté" : "Pas encore connecté")) + '</div>'
    + '</div>'
    + (last ? '<div class="hint" style="margin-top:8px">Dernier échange : ' + esc(last) + '</div>' : "")
    + '<div class="hint" style="margin-top:8px">'
      + 'Bibliothèque Google : ' + (Sync.gisReady() ? "chargée" : "<b style=\'color:var(--neg)\'>absente</b>")
      + ' · adresse : ' + esc(location.origin || location.protocol)
    + '</div>'
    + '<div class="hint" style="margin-top:12px">'
      + 'Tes données sont rangées dans un dossier privé de ton Google Drive, réservé à cette app. '
      + 'Le Mac et le téléphone lisent le même fichier : la version la plus récente gagne. '
      + 'Évite de modifier les deux en même temps hors connexion.'
    + '</div>'
    + (Sync.available() ? "" :
        '<div class="hint" style="margin-top:12px;color:var(--neg)">Cette page est ouverte en fichier local. '
        + 'Google exige une vraie adresse : relance l\'app Comptes, ou ouvre le site.</div>')
    + '<div class="acts">'
      + (Sync.on() ? '<button class="btn btn-danger" data-syncoff>Déconnecter</button>' : "")
      + '<button class="btn" data-cancel>Fermer</button>'
      + '<button class="btn btn-p" data-syncnow' + (Sync.available() ? "" : " disabled") + '>'
        + (Sync.on() ? "Synchroniser" : "Connecter Google Drive") + '</button>'
    + '</div>';
  box.querySelector("[data-cancel]").onclick = closeModal;
  const off = box.querySelector("[data-syncoff]");
  if (off) off.onclick = () => { Sync.disconnect(); drawSyncModal(); };
  box.querySelector("[data-syncnow]").onclick = () => Sync.run(true);
}

/* ============================ toast ============================ */
const toastEl = document.getElementById("toast");
let toastT = null;
function toast(msg, actionLabel, action){
  clearTimeout(toastT);
  toastEl.innerHTML = '<span>'+esc(msg)+'</span>' + (actionLabel ? '<button data-undo>'+esc(actionLabel)+'</button>' : "");
  toastEl.hidden = false;
  requestAnimationFrame(() => toastEl.classList.add("on"));
  const u = toastEl.querySelector("[data-undo]");
  if (u) u.onclick = () => { action(); hideToast(); };
  toastT = setTimeout(hideToast, 6000);
}
function hideToast(){
  toastEl.classList.remove("on");
  setTimeout(() => { toastEl.hidden = true; }, 240);
}


/* --- menu « Plus » (téléphone) --- */
const MORE = [
  ["cats","Catégories"], ["csv","Importer un relevé"],
  ["sync","Synchronisation"], ["export","Sauvegarder"], ["import","Restaurer"]
];
function modalMore(){
  openModal('<h3>Plus</h3>'
    + MORE.map(([a,l]) => '<button class="btn" style="width:100%;text-align:left;margin-bottom:7px;padding:11px 13px" data-more="'+a+'">'+l+'</button>').join("")
    + '<div class="acts"><button class="btn" data-cancel>Fermer</button></div>');
  ov.querySelector("[data-cancel]").onclick = closeModal;
  ov.querySelectorAll("[data-more]").forEach(b => {
    b.onclick = () => { closeModal(); sideAction(b.dataset.more); };
  });
}

/** actions communes à la barre latérale et au menu « Plus » */
function sideAction(act){
  if (act === "sync")   return modalSync();
  if (act === "cats")   return modalCats();
  if (act === "csv")    return openCsvPicker(null);
  if (act === "export") return doExport();
  if (act === "import") return openRestorePicker();
}

function openRestorePicker(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if (!d.accounts) throw new Error("format");
        S = d;
        migrateState();
        save(); render(); toast("Données restaurées");
      }catch(err){ toast("Fichier illisible"); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============================ événements ============================ */
document.getElementById("addBtn").onclick = () => modalTx();

view.addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del){
    const t = S.tx.find(x => x.id === del.dataset.del);
    S.tx = S.tx.filter(x => x.id !== del.dataset.del);
    save(); render();
    toast("Supprimé", "Annuler", () => { S.tx.push(t); save(); render(); });
    return;
  }
  const dm = e.target.closest("[data-delmark]");
  if (dm){
    const m = S.marks.find(x => x.id === dm.dataset.delmark);
    S.marks = S.marks.filter(x => x.id !== dm.dataset.delmark);
    save(); render();
    toast("Montant supprimé", "Annuler", () => { S.marks.push(m); save(); render(); });
    return;
  }
  if (e.target.closest('[data-act2="cats"]')){ modalCats(); return; }
  const ea = e.target.closest("[data-editacc]");   if (ea){ modalAcc(ea.dataset.editacc); return; }
  const ca = e.target.closest("[data-csvacc]");    if (ca){ openCsvPicker(ca.dataset.csvacc); return; }
  if (e.target.closest("[data-newacc]")){ modalAcc(null); return; }
  const av = e.target.closest("[data-addvers]");   if (av){ modalVersement(av.dataset.addvers); return; }
  if (e.target.closest("[data-newhold]")){ modalAddHolding(); return; }
  const hd = e.target.closest("[data-hold]");      if (hd){ modalHolding(hd.dataset.hold); return; }
  // en dernier : le clic sur la carte elle-même ouvre la page du compte
  const oa = e.target.closest("[data-openacc]");   if (oa){ openAcc = oa.dataset.openacc; render(); return; }
  const et = e.target.closest("[data-edittx]");    if (et){ modalTx(et.dataset.edittx); return; }
});

function doExport(){
  const json = JSON.stringify(S, null, 2);
  try{ window.webkit.messageHandlers.export.postMessage(json); return; }catch(e){}
  const blob = new Blob([json], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "comptes-" + todayISO() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Sauvegarde téléchargée");
}

document.querySelector(".side-foot").onclick = e => {
  const b = e.target.closest("[data-act]");
  if (b) sideAction(b.dataset.act);
};
document.getElementById("moreBtn").onclick = () => { if (ov.hidden) modalMore(); };

document.addEventListener("keydown", e => {
  if (!(e.metaKey || e.ctrlKey)) return;
  const k = e.key.toLowerCase();
  if (k === "n"){ e.preventDefault(); if (ov.hidden) modalTx(); }
});

window.__newTx  = () => { if (ov.hidden) modalTx(); };
window.__export = doExport;
window.__csv    = () => { if (ov.hidden) openCsvPicker(null); };
window.__cats   = () => { if (ov.hidden) modalCats(); };
window.__sync   = () => { if (ov.hidden) modalSync(); };

render();
if (Store.loadError) setTimeout(() => toast(Store.loadError), 600);
runRecurring();
refreshStaleQuotes();
if (Sync.on()) setTimeout(() => Sync.run(false), 900);

/* fonctionnement hors connexion, une fois la page installée sur le téléphone */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
